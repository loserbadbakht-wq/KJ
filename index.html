<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz · FMHY Theme</title>

    <style>
        /* ====== INTER VARIABLE ====== */
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 1 999;
            src: url('https://raw.githubusercontent.com/loserbadbakht-wq/shs/refs/heads/main/Inter-VariableFont_opsz,wght.ttf') format('truetype-variations');
            font-display: swap;
        }

        /* ====== LOCAL VAZIR ====== */
        @font-face {
            font-family: 'Vazir';
            src: url('fonts/Vazir.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vazir Bold';
            src: url('fonts/Vazir-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        /* ====== LOCAL BIZ UDPMINCHO ====== */
        @font-face {
            font-family: 'BIZ UDPMincho';
            src: url('fonts/BIZUDPMincho-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'BIZ UDPMincho Bold';
            src: url('fonts/BIZUDPMincho-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        /* ====== FONT AWESOME ====== */
        @font-face {
            font-family: 'Font Awesome 6 Free';
            font-style: normal;
            font-weight: 900;
            src: url('fonts/fa-solid-900.ttf') format('truetype');
            font-display: block;
        }
        .fas,
        .fa-solid {
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            display: inline-block;
            font-style: normal;
            font-variant: normal;
            text-rendering: auto;
            line-height: 1;
            width: 1em;
            text-align: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ====== ICON DEFINITIONS ====== */
        .fa-graduation-cap::before { content: "\f19d"; }
        .fa-book::before          { content: "\f02d"; }
        .fa-sync-alt::before      { content: "\f2f1"; }
        .fa-undo::before          { content: "\f0e2"; }
        .fa-check::before         { content: "\f00c"; }
        .fa-times::before         { content: "\f00d"; }
        .fa-folder-open::before   { content: "\f07c"; }
        .fa-hourglass-half::before{ content: "\f252"; }
        .fa-check-circle::before  { content: "\f058"; }
        .fa-times-circle::before  { content: "\f057"; }
        .fa-flag-checkered::before{ content: "\f11e"; }
        .fa-exclamation-circle::before { content: "\f06a"; }
        .fa-list-ul::before       { content: "\f0ca"; }
        .fa-trophy::before        { content: "\f091"; }
        .fa-chevron-right::before { content: "\f054"; }
        .fa-arrow-left::before    { content: "\f060"; }

        /* ─── ROOT ─── */
        :root {
            --bg: #0c0c0c;
            --bg-card: #161616;
            --bg-input: #1e1e1e;
            --bg-hover: #242424;
            --text: #e6e6e6;
            --text-secondary: #9a9a9a;
            --text-muted: #5a5a5a;
            --border: #262626;
            --border-hover: #383838;
            --primary: #00d4ff;
            --primary-hover: #40e0ff;
            --primary-light: #0a2833;
            --danger: #ef4444;
            --danger-light: rgba(239, 68, 68, 0.1);
            --success: #22c55e;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 10px;
            --radius-sm: 6px;
            --transition: 0.2s ease;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --header-height: 56px;
        }

        /* ─── RESET & BASE ─── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            font-size: 17px;
            -webkit-font-smoothing: antialiased;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            display: flex;
            flex-direction: column;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.03) 0%, transparent 50%);
            background-attachment: fixed;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--border-hover);
            border-radius: 20px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ─── HEADER ─── */
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.3px;
        }
        .header-logo i { font-size: 22px; }
        .header-logo span {
            color: var(--text-secondary);
            font-weight: 400;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }
        .header-actions .btn-icon:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
            color: var(--text);
        }

        /* ─── APP LAYOUT ─── */
        .app {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 24px 24px 32px;
        }

        /* ─── MAIN CARD ─── */
        .card {
            max-width: 720px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 26px 26px;
            box-shadow: var(--shadow);
            height: fit-content;
            animation: fadeUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ═══════════════════════════════════════════════════════════
           END-OF-QUIZ MODE: hide everything except the results panel
           ═══════════════════════════════════════════════════════════ */
        .card.quiz-finished #progressDisplay,
        .card.quiz-finished #question-heading,
        .card.quiz-finished #spoilerContainer,
        .card.quiz-finished #answerBtnRow,
        .card.quiz-finished #feedbackArea {
            display: none !important;
        }

        /* ─── LOAD BAR ─── */
        .load-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding-bottom: 14px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        /* ─── CIRCULAR QUIZ PICKER (animation unchanged) ─── */
        .quiz-picker {
            position: relative;
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
        }
        .quiz-picker-btn {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 50%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--primary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            line-height: 1;
            transition: background 0.2s ease, border-color 0.2s ease,
                        color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }
        .quiz-picker-btn .fa-solid {
            transition: transform 0.25s ease;
        }
        .quiz-picker-btn:hover:not(:disabled) {
            background: var(--bg-hover);
            border-color: var(--primary);
            color: var(--primary-hover);
            transform: scale(1.08);
            box-shadow: 0 4px 18px rgba(0, 212, 255, 0.35);
        }
        .quiz-picker-btn:hover:not(:disabled) .fa-solid {
            transform: rotate(-12deg);
        }
        .quiz-picker-btn:active:not(:disabled) {
            transform: scale(0.97);
        }
        .quiz-picker-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .quiz-picker.open .quiz-picker-btn {
            background: var(--bg-hover);
            border-color: var(--primary);
            color: var(--primary-hover);
            box-shadow: 0 4px 18px rgba(0, 212, 255, 0.4);
        }

        /* ─── DROPDOWN MENU ─── */
        .quiz-picker-menu {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            min-width: 260px;
            max-width: 380px;
            max-height: 360px;
            overflow-y: auto;
            padding: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px) scale(0.97);
            transform-origin: top left;
            transition: opacity 0.18s ease, transform 0.18s ease,
                        visibility 0s linear 0.18s;
            z-index: 100;
        }
        .quiz-picker.open .quiz-picker-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            transition: opacity 0.18s ease, transform 0.18s ease,
                        visibility 0s linear 0s;
        }
        .quiz-picker-menu::-webkit-scrollbar { width: 4px; }
        .quiz-picker-menu::-webkit-scrollbar-track { background: transparent; }
        .quiz-picker-menu::-webkit-scrollbar-thumb {
            background: var(--border-hover);
            border-radius: 20px;
        }

        /* ─── COMMON PICKER ITEM ─── */
        .quiz-picker-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 8px 10px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-align: left;
            transition: background var(--transition), color var(--transition);
            direction: ltr;
            overflow: hidden;
        }

        /* Category item */
        .quiz-picker-cat .quiz-cat {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 5px;
            flex-shrink: 0;
        }
        .quiz-picker-cat .quiz-cat-count {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: auto;
            flex-shrink: 0;
        }
        .quiz-picker-cat .quiz-cat-arrow {
            font-size: 9px;
            color: var(--text-muted);
            transition: transform 0.2s ease, color 0.2s ease;
            width: auto;
            flex-shrink: 0;
        }
        .quiz-picker-cat:hover {
            background: var(--bg-hover);
            color: var(--text);
        }
        .quiz-picker-cat:hover .quiz-cat {
            background: rgba(255, 255, 255, 0.09);
            color: var(--text);
        }
        .quiz-picker-cat:hover .quiz-cat-arrow {
            color: var(--primary);
            transform: translateX(2px);
        }
        .quiz-picker-cat.active {
            background: var(--primary-light);
        }
        .quiz-picker-cat.active .quiz-cat {
            background: rgba(0, 212, 255, 0.16);
            color: var(--primary);
        }

        /* Back button */
        .quiz-picker-back {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 6px 10px;
            margin-bottom: 4px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            cursor: pointer;
            text-align: left;
            transition: color var(--transition), background var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .quiz-picker-back:hover {
            color: var(--primary);
            background: var(--bg-hover);
        }
        .quiz-picker-back .fa-solid {
            font-size: 0.9em;
            width: auto;
        }

        /* Quiz item */
        .quiz-picker-quiz .quiz-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
            direction: auto;
            text-align: left;
        }
        .quiz-picker-quiz:hover {
            background: var(--bg-hover);
            color: var(--text);
        }
        .quiz-picker-quiz.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }
        .quiz-picker-quiz.active:hover {
            background: var(--primary-light);
            color: var(--primary-hover);
        }
        .quiz-picker-quiz.has-error .quiz-title {
            color: var(--danger);
            opacity: 0.8;
        }

        /* Disabled / loading */
        .quiz-picker-item.disabled {
            color: var(--text-muted);
            cursor: default;
            font-style: italic;
            justify-content: center;
        }
        .quiz-picker-item.disabled:hover {
            background: transparent;
            color: var(--text-muted);
        }

        /* ─── PROGRESS ─── */
        .progress {
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        .progress span {
            color: var(--primary);
            font-weight: 700;
        }

        /* ─── QUESTION (animated gradient – unchanged) ─── */
        .question {
            font-family: var(--font);
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.55;
            letter-spacing: -0.02em;
            margin-bottom: 30px;
            text-align: center;
            white-space: pre-wrap;
            min-height: 3.2rem;

            background: linear-gradient(135deg, #a78bfa, #34d399);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradShift 5s ease-in-out infinite alternate;

            dir: auto;
        }
        @keyframes gradShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .question::after {
            content: '';
            display: block;
            width: 56px;
            height: 3px;
            margin: 14px auto 0;
            border-radius: 3px;
            background: linear-gradient(90deg, #a78bfa, #34d399);
            background-size: 200% 200%;
            animation: gradShift 5s ease-in-out infinite alternate;
            opacity: 0.4;
        }

        /* ─── SPOILER ─── */
        .spoiler-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin: 0 0 4px 0;
            padding: 0;
        }

        .spoiler-toggle {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            transition: background 0.2s ease, border-color 0.2s ease,
                        color 0.2s ease,
                        transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
        }
        .spoiler-toggle:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }
        .spoiler-toggle:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .spoiler-container.revealed .spoiler-toggle {
            transform: translateY(var(--spoiler-lift, -6px));
        }

        .spoiler-answer {
            font-family: var(--font);
            font-size: 14px;
            font-weight: 500;
            color: var(--primary);
            background: var(--primary-light);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(0, 212, 255, 0.25);
            white-space: pre-wrap;
            line-height: 1.55;
            max-width: 100%;
            word-break: break-word;
            dir: auto;
            text-align: center;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin-top: 0;
            padding-top: 0;
            padding-bottom: 0;
            border-width: 0;
            transition: max-height 0.4s ease,
                        opacity 0.35s ease,
                        margin-top 0.35s ease,
                        padding 0.35s ease,
                        border-width 0.35s ease;
        }
        .spoiler-container.revealed .spoiler-answer {
            max-height: var(--answer-max-height, 800px);
            opacity: 1;
            margin-top: 6px;
            padding: 8px 16px;
            border-width: 1px;
        }

        /* ─── FONT SWITCHING BY LANGUAGE ─── */
        .card.font-vazir .question,
        .card.font-vazir .failure-item .failure-q {
            font-family: 'Vazir Bold', var(--font);
        }
        .card.font-vazir .spoiler-answer,
        .card.font-vazir .failure-item .failure-a {
            font-family: 'Vazir', var(--font);
        }

        .card.font-jp .question,
        .card.font-jp .failure-item .failure-q {
            font-family: 'BIZ UDPMincho Bold', var(--font);
        }
        .card.font-jp .spoiler-answer,
        .card.font-jp .failure-item .failure-a {
            font-family: 'BIZ UDPMincho', var(--font);
        }

        /* ─── ACTION BUTTONS ─── */
        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .btn {
            flex: 1;
            min-width: 100px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            color: var(--text);
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn span {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn .fa-solid {
            font-size: 0.9em;
            transition: transform 0.25s ease;
        }

        .btn-know {
            color: var(--primary);
            border-color: rgba(0, 212, 255, 0.45);
            background: transparent;
        }
        .btn-know:hover:not(:disabled) {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary-hover);
        }
        .btn-know:hover:not(:disabled) .fa-check {
            transform: scale(1.25);
        }

        .btn-dontknow {
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.45);
            background: transparent;
        }
        .btn-dontknow:hover:not(:disabled) {
            background: var(--danger-light);
            border-color: var(--danger);
            color: #fca5a5;
        }
        .btn-dontknow:hover:not(:disabled) .fa-times {
            transform: rotate(90deg);
        }

        .btn-reset {
            color: var(--text-secondary);
            flex: 0 0 auto;
            min-width: 60px;
            padding: 14px 20px;
            font-size: 15px;
        }
        .btn-reset:hover:not(:disabled) {
            background: var(--bg-hover);
            border-color: var(--border-hover);
            color: var(--text);
        }
        .btn-reset:hover:not(:disabled) .fa-undo {
            transform: rotate(-180deg);
        }

        /* ─── FEEDBACK ─── */
        .feedback {
            margin-top: 18px;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
            min-height: 3.4rem;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            transition: border var(--transition), background var(--transition),
                        color var(--transition);
        }
        .feedback.correct {
            background: rgba(34, 197, 94, 0.08);
            border-color: rgba(34, 197, 94, 0.4);
            color: #4ade80;
        }
        .feedback.wrong {
            background: rgba(220, 38, 38, 0.08);
            border-color: rgba(220, 38, 38, 0.4);
            color: #f87171;
        }
        .feedback.done {
            background: var(--primary-light);
            border-color: rgba(0, 212, 255, 0.4);
            color: var(--primary);
        }
        .feedback .icon {
            font-size: 1.4rem;
            flex-shrink: 0;
            line-height: 1;
        }
        .feedback .msg { flex: 1; }

        /* ─── SUMMARY PANEL ─── */
        .summary {
            margin-top: 0;
            padding: 20px 22px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            animation: fadeUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .summary-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            letter-spacing: -0.01em;
        }
        .summary-title .fa-solid { font-size: 1rem; }

        .summary-stats {
            font-size: 13px;
            color: var(--text-secondary);
            padding-bottom: 14px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
            line-height: 1.6;
        }
        .summary-stats strong { color: var(--text); font-weight: 600; }
        .summary-stats .stat-know { color: #4ade80; font-weight: 700; }
        .summary-stats .stat-miss { color: #f87171; font-weight: 700; }

        .summary-failures-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .summary-failures-title .fa-solid { font-size: 0.85em; }

        .failure-item {
            padding: 11px 14px;
            background: rgba(220, 38, 38, 0.06);
            border-left: 3px solid var(--danger);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
        }
        .failure-item:last-child { margin-bottom: 0; }
        .failure-item .failure-q {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 6px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            dir: auto;
        }
        .failure-item .failure-a {
            font-size: 12.5px;
            color: #fca5a5;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            dir: auto;
        }
        .failure-item .failure-a .a-label {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-size: 10px;
            margin-right: 4px;
        }
        .failure-item .failure-a strong {
            color: #fecaca;
            font-weight: 600;
        }

        .summary-all-good {
            padding: 14px 16px;
            background: rgba(34, 197, 94, 0.08);
            border-left: 3px solid var(--success);
            border-radius: var(--radius-sm);
            color: #4ade80;
            font-size: 13.5px;
            font-weight: 500;
        }

        /* Restart button inside summary */
        .summary-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .summary-actions .btn {
            flex: 1;
            min-width: 120px;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 540px) {
            .header { padding: 0 16px; }
            .header-logo { font-size: 17px; }
            .header-logo i { font-size: 18px; }
            .app { padding: 14px 12px 20px; }
            .card { padding: 18px 16px 20px; }
            .question { font-size: 1.5rem; margin-bottom: 26px; }
            .btn-row { flex-direction: column; }
            .btn { font-size: 14px; padding: 13px 16px; }
            .btn-reset { min-width: 100%; }
            .feedback { font-size: 13px; padding: 12px 14px; }
            .quiz-picker-menu { min-width: 240px; max-width: 90vw; }
            .summary { padding: 16px 14px; }
            .summary-title { font-size: 15px; }
            .summary-actions { flex-direction: column; }
            .summary-actions .btn { min-width: 100%; }
        }
        @media (max-width: 380px) {
            .question { font-size: 1.25rem; }
            .card { padding: 16px 12px 18px; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <div class="header-logo">
                <i class="fas fa-graduation-cap"></i> Quiz<span>Master</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-icon" id="reloadBtn" type="button" title="Reload current quiz">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </header>

    <div class="app">
        <main class="card" id="quizCard" role="main" aria-labelledby="question-heading">

            <div class="load-bar">
                <div class="quiz-picker" id="quizPicker">
                    <button
                        class="quiz-picker-btn"
                        id="quizPickerBtn"
                        type="button"
                        aria-label="Choose quiz file"
                        aria-haspopup="true"
                        aria-expanded="false"
                        disabled
                    >
                        <i class="fa-solid fa-book" aria-hidden="true"></i>
                    </button>
                    <div class="quiz-picker-menu" id="quizPickerMenu" role="menu" aria-label="Quizzes">
                        <div class="quiz-picker-item disabled">Loading…</div>
                    </div>
                </div>
            </div>

            <div class="progress" id="progressDisplay">
                Question <span id="currentNum">0</span> of <span id="totalNum">0</span>
            </div>

            <h1 id="question-heading" class="question" dir="auto">Loading…</h1>

            <div class="spoiler-container" id="spoilerContainer">
                <button class="spoiler-toggle" id="spoilerToggle" type="button">Show answer</button>
                <div class="spoiler-answer" id="spoilerAnswer"></div>
            </div>

            <div class="btn-row" id="answerBtnRow">
                <button class="btn btn-know" id="knowBtn" type="button" disabled>
                    <span>
                        <i class="fa-solid fa-check" aria-hidden="true"></i>
                        میدونم
                    </span>
                </button>
                <button class="btn btn-dontknow" id="dontKnowBtn" type="button" disabled>
                    <span>
                        <i class="fa-solid fa-times" aria-hidden="true"></i>
                        نمیدونم
                    </span>
                </button>
                <button class="btn btn-reset" id="resetBtn" type="button" title="Restart quiz">
                    <span>
                        <i class="fa-solid fa-undo" aria-hidden="true"></i>
                        Restart
                    </span>
                </button>
            </div>

            <div class="feedback" id="feedbackArea" role="status" aria-live="polite">
                <i class="icon fa-solid fa-folder-open" aria-hidden="true"></i>
                <span class="msg">Waiting for quiz files…</span>
            </div>

            <!-- End-of-quiz summary (only thing visible when quiz-finished) -->
            <section class="summary" id="summaryPanel" hidden aria-live="polite">
                <h2 class="summary-title">
                    <i class="fa-solid fa-flag-checkered" aria-hidden="true"></i>
                    Results
                </h2>
                <div class="summary-stats" id="summaryStats"></div>
                <div id="summaryFailuresContainer"></div>
                <div class="summary-actions">
                    <button class="btn btn-know" id="summaryRestartBtn" type="button">
                        <span>
                            <i class="fa-solid fa-undo" aria-hidden="true"></i>
                            Restart Quiz
                        </span>
                    </button>
                </div>
            </section>

        </main>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── CONFIG ────────────────────────────────────────────
            const MANIFEST_URL = 'json/manifest.json';
            const JSON_DIR = 'json/';
            const VAZIR_LANGS = ['fa', 'ar', 'he', 'ur', 'ps'];
            const JP_LANGS = ['jp', 'ja'];

            // ─── DOM REFS ──────────────────────────────────────────
            const card           = document.getElementById('quizCard');
            const questionEl     = document.getElementById('question-heading');
            const progressNum    = document.getElementById('currentNum');
            const totalNum       = document.getElementById('totalNum');
            const knowBtn        = document.getElementById('knowBtn');
            const dontKnowBtn    = document.getElementById('dontKnowBtn');
            const resetBtn       = document.getElementById('resetBtn');
            const feedbackEl     = document.getElementById('feedbackArea');
            const spoilerToggle  = document.getElementById('spoilerToggle');
            const spoilerAnswer  = document.getElementById('spoilerAnswer');
            const spoilerContainer = document.getElementById('spoilerContainer');
            const quizPicker     = document.getElementById('quizPicker');
            const quizPickerBtn  = document.getElementById('quizPickerBtn');
            const quizPickerMenu = document.getElementById('quizPickerMenu');
            const reloadBtn      = document.getElementById('reloadBtn');
            const summaryPanel   = document.getElementById('summaryPanel');
            const summaryStats   = document.getElementById('summaryStats');
            const summaryFailuresContainer = document.getElementById('summaryFailuresContainer');
            const summaryRestartBtn = document.getElementById('summaryRestartBtn');

            // ─── STATE ─────────────────────────────────────────────
            let ALL_QUESTIONS = [];
            let shuffledQuestions = [];
            let currentIndex = 0;
            let isComplete = false;
            let autoAdvanceTimer = null;
            let spoilerVisible = false;
            let currentFile = '';
            let currentCategory = '';
            let failures = [];

            let QUIZ_CACHE = {};
            let QUIZ_TREE  = {};
            let HAS_CATEGORIES = false;

            let hoverCloseTimer = null;

            // ─── HELPERS ───────────────────────────────────────────
            function normalizeAnswer(answer) {
                if (Array.isArray(answer)) return answer.map(String).join('\n');
                if (answer == null) return '';
                return String(answer).replace(/<br\s*\/?>/gi, '\n');
            }

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function escapeHtml(str) {
                return String(str == null ? '' : str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function setFeedback(iconClass, message, type) {
                feedbackEl.classList.remove('correct', 'wrong', 'done');
                const iconSpan = feedbackEl.querySelector('.icon');
                if (iconSpan) iconSpan.className = 'icon fa-solid ' + iconClass;
                const msgSpan = feedbackEl.querySelector('.msg');
                if (msgSpan) msgSpan.innerHTML = message;
                if (type) feedbackEl.classList.add(type);
            }

            function resetFeedback() {
                setFeedback('fa-hourglass-half', 'Choose میدونم or نمیدونم.', null);
            }

            function updateProgress() {
                progressNum.textContent = Math.min(currentIndex + 1, shuffledQuestions.length);
                totalNum.textContent = shuffledQuestions.length;
            }

            // ─── MANIFEST NORMALIZATION ────────────────────────────
            function normalizeManifest(manifest) {
                const out = [];

                if (manifest && manifest.categories && typeof manifest.categories === 'object') {
                    Object.keys(manifest.categories).forEach(function(cat) {
                        const list = manifest.categories[cat];
                        if (!Array.isArray(list)) return;
                        list.forEach(function(fname) {
                            if (typeof fname === 'string' && fname.trim()) {
                                out.push({ file: fname.trim(), category: cat });
                            }
                        });
                    });
                    return out;
                }

                if (manifest && Array.isArray(manifest.files)) {
                    manifest.files.forEach(function(entry) {
                        if (typeof entry === 'string') {
                            if (entry.trim()) out.push({ file: entry.trim(), category: '' });
                        } else if (entry && typeof entry.file === 'string' && entry.file.trim()) {
                            out.push({
                                file: entry.file.trim(),
                                category: (typeof entry.category === 'string') ? entry.category.trim() : ''
                            });
                        }
                    });
                }

                return out;
            }

            // ─── PRELOAD & TREE BUILD ──────────────────────────────
            async function preloadAllQuizzes(entries) {
                await Promise.all(entries.map(async function(entry) {
                    const filename = entry.file;
                    try {
                        const res = await fetch(JSON_DIR + filename, { cache: 'no-store' });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        const title = (data && typeof data.title === 'string' && data.title.trim())
                            ? data.title.trim()
                            : filename.replace(/\.json$/i, '');
                        QUIZ_CACHE[filename] = { data: data, title: title, error: null };
                    } catch (err) {
                        console.warn('Preload failed:', filename, err);
                        QUIZ_CACHE[filename] = {
                            data: null,
                            title: filename.replace(/\.json$/i, ''),
                            error: err.message || 'Failed to load'
                        };
                    }
                }));
            }

            function buildQuizTree(entries) {
                QUIZ_TREE = {};
                HAS_CATEGORIES = false;

                entries.forEach(function(entry) {
                    const info = QUIZ_CACHE[entry.file] || {};
                    const title = info.title || entry.file.replace(/\.json$/i, '');
                    const cat = (entry.category || '').trim() || 'Uncategorized';
                    if (entry.category && entry.category.trim()) HAS_CATEGORIES = true;
                    if (!QUIZ_TREE[cat]) QUIZ_TREE[cat] = [];
                    QUIZ_TREE[cat].push({
                        file: entry.file,
                        title: title,
                        error: info.error || null
                    });
                });
            }

            // ─── QUIZ PICKER ───────────────────────────────────────
            const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

            function openPicker() {
                if (quizPickerBtn.disabled) return;
                cancelClose();
                renderPickerInitial();
                quizPicker.classList.add('open');
                quizPickerBtn.setAttribute('aria-expanded', 'true');
            }
            function closePicker() {
                quizPicker.classList.remove('open');
                quizPickerBtn.setAttribute('aria-expanded', 'false');
            }
            function togglePicker() {
                quizPicker.classList.contains('open') ? closePicker() : openPicker();
            }
            function scheduleClose() {
                cancelClose();
                hoverCloseTimer = setTimeout(function() {
                    hoverCloseTimer = null;
                    closePicker();
                }, 220);
            }
            function cancelClose() {
                if (hoverCloseTimer) {
                    clearTimeout(hoverCloseTimer);
                    hoverCloseTimer = null;
                }
            }

            // ─── PICKER RENDERING ──────────────────────────────────
            function renderPickerLoading(message) {
                quizPickerMenu.innerHTML = '';
                const item = document.createElement('div');
                item.className = 'quiz-picker-item disabled';
                item.textContent = message || 'Loading…';
                quizPickerMenu.appendChild(item);
                quizPickerBtn.disabled = true;
            }

            function renderPickerInitial() {
                const categories = Object.keys(QUIZ_TREE);
                if (categories.length === 0) {
                    renderPickerLoading('No quizzes');
                    return;
                }
                if (!HAS_CATEGORIES || categories.length === 1) {
                    renderPickerQuizzes(categories[0]);
                } else {
                    renderPickerCategories();
                }
            }

            function renderPickerCategories() {
                const categories = Object.keys(QUIZ_TREE).sort(function(a, b) {
                    return a.localeCompare(b);
                });

                let html = '';
                categories.forEach(function(cat) {
                    const quizzes = QUIZ_TREE[cat];
                    const isActive = currentFile && quizzes.some(function(q) {
                        return q.file === currentFile;
                    });
                    html +=
                        '<button type="button" class="quiz-picker-item quiz-picker-cat' +
                            (isActive ? ' active' : '') + '" data-category="' + escapeHtml(cat) + '">' +
                            '<span class="quiz-cat">' + escapeHtml(cat) + '</span>' +
                            '<span class="quiz-cat-count">' + quizzes.length + '</span>' +
                            '<i class="fa-solid fa-chevron-right quiz-cat-arrow" aria-hidden="true"></i>' +
                        '</button>';
                });

                quizPickerMenu.innerHTML = html;
                quizPickerBtn.disabled = false;
            }

            function renderPickerQuizzes(category) {
                let quizzes = [];
                let showBack = false;

                if (category && QUIZ_TREE[category]) {
                    quizzes = QUIZ_TREE[category];
                    showBack = HAS_CATEGORIES && Object.keys(QUIZ_TREE).length > 1;
                } else {
                    Object.keys(QUIZ_TREE).forEach(function(cat) {
                        quizzes = quizzes.concat(QUIZ_TREE[cat]);
                    });
                }

                let html = '';
                if (showBack) {
                    html +=
                        '<button type="button" class="quiz-picker-back" data-action="back">' +
                            '<i class="fa-solid fa-arrow-left" aria-hidden="true"></i> All categories' +
                        '</button>';
                }

                if (quizzes.length === 0) {
                    html += '<div class="quiz-picker-item disabled">No quizzes</div>';
                } else {
                    quizzes.forEach(function(q) {
                        const isActive = q.file === currentFile;
                        const hasError = !!q.error;
                        html +=
                            '<button type="button" class="quiz-picker-item quiz-picker-quiz' +
                                (isActive ? ' active' : '') +
                                (hasError ? ' has-error' : '') + '" ' +
                                'data-file="' + escapeHtml(q.file) + '" ' +
                                'title="' + escapeHtml(q.file) + '">' +
                                '<span class="quiz-title">' + escapeHtml(q.title) + '</span>' +
                            '</button>';
                    });
                }

                quizPickerMenu.innerHTML = html;
                quizPickerBtn.disabled = false;
            }

            // ─── PICKER EVENTS ─────────────────────────────────────
            quizPickerMenu.addEventListener('click', function(e) {
                const backBtn = e.target.closest('.quiz-picker-back');
                if (backBtn) {
                    e.stopPropagation();
                    renderPickerCategories();
                    return;
                }

                const catBtn = e.target.closest('.quiz-picker-cat');
                if (catBtn) {
                    e.stopPropagation();
                    renderPickerQuizzes(catBtn.dataset.category);
                    return;
                }

                const quizBtn = e.target.closest('.quiz-picker-quiz');
                if (quizBtn) {
                    e.stopPropagation();
                    const filename = quizBtn.dataset.file;
                    closePicker();
                    if (filename !== currentFile) {
                        loadQuiz(filename);
                    }
                    return;
                }
            });

            if (canHover) {
                quizPicker.addEventListener('mouseenter', function() {
                    cancelClose();
                    openPicker();
                });
                quizPicker.addEventListener('mouseleave', function() {
                    scheduleClose();
                });
            }

            quizPickerBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                togglePicker();
            });

            document.addEventListener('click', function(e) {
                if (!quizPicker.contains(e.target)) {
                    cancelClose();
                    closePicker();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    cancelClose();
                    closePicker();
                }
            });

            // ─── LANGUAGE / FONT ───────────────────────────────────
            function applyLanguageFont(language) {
                const lang = (language || '').toLowerCase().trim();
                const useVazir = VAZIR_LANGS.indexOf(lang) !== -1;
                const useJP    = JP_LANGS.indexOf(lang) !== -1;
                card.classList.toggle('font-vazir', useVazir);
                card.classList.toggle('font-jp', useJP);
            }

            // ─── SPOILER ───────────────────────────────────────────
            function updateSpoiler(answer) {
                const normalized = normalizeAnswer(answer);
                spoilerAnswer.textContent = normalized;

                spoilerContainer.classList.remove('revealed');
                spoilerToggle.textContent = 'Show answer';
                spoilerVisible = false;

                const lines = Math.max(1, normalized.split('\n').length);
                const lift = -(6 + Math.min((lines - 1) * 5, 24));
                spoilerContainer.style.setProperty('--spoiler-lift', lift + 'px');

                requestAnimationFrame(function() {
                    const h = spoilerAnswer.scrollHeight;
                    const maxH = Math.max(h + 40, 200);
                    spoilerContainer.style.setProperty('--answer-max-height', maxH + 'px');
                });
            }

            function toggleSpoiler() {
                if (spoilerVisible) {
                    spoilerContainer.classList.remove('revealed');
                    spoilerToggle.textContent = 'Show answer';
                } else {
                    spoilerContainer.classList.add('revealed');
                    spoilerToggle.textContent = 'Hide answer';
                }
                spoilerVisible = !spoilerVisible;
            }

            // ─── SUMMARY ───────────────────────────────────────────
            function showSummary() {
                const total = shuffledQuestions.length;
                const failCount = failures.length;
                const knowCount = total - failCount;
                const pct = total > 0 ? Math.round((knowCount / total) * 100) : 0;

                summaryStats.innerHTML =
                    'You knew <span class="stat-know">' + knowCount + '</span> of <strong>' + total + '</strong> ' +
                    '(' + pct + '%) &nbsp;·&nbsp; missed <span class="stat-miss">' + failCount + '</span>';

                if (failCount === 0) {
                    summaryFailuresContainer.innerHTML =
                        '<div class="summary-all-good"><i class="fa-solid fa-trophy" aria-hidden="true"></i> Perfect! You knew every question.</div>';
                } else {
                    let html = '<div class="summary-failures-title">' +
                               '<i class="fa-solid fa-list-ul" aria-hidden="true"></i>' +
                               ' Questions you missed</div>';
                    failures.forEach(function(f) {
                        html +=
                            '<div class="failure-item">' +
                                '<div class="failure-q">' + escapeHtml(f.question) + '</div>' +
                                '<div class="failure-a"><span class="a-label">Answer:</span>' +
                                    '<strong>' + escapeHtml(f.answer) + '</strong></div>' +
                            '</div>';
                    });
                    summaryFailuresContainer.innerHTML = html;
                }

                summaryPanel.hidden = false;
            }

            function hideSummary() {
                summaryPanel.hidden = true;
                summaryStats.innerHTML = '';
                summaryFailuresContainer.innerHTML = '';
            }

            // ─── EMPTY STATE ───────────────────────────────────────
            function showEmptyState(message) {
                card.classList.remove('quiz-finished');
                questionEl.textContent = message || 'Load a quiz file to begin';
                progressNum.textContent = '0';
                totalNum.textContent = '0';
                knowBtn.disabled = true;
                dontKnowBtn.disabled = true;
                spoilerToggle.disabled = true;
                spoilerContainer.classList.remove('revealed');
                spoilerToggle.textContent = 'Show answer';
                spoilerVisible = false;
                spoilerContainer.style.display = '';
                hideSummary();
                setFeedback('fa-folder-open', 'No quiz loaded.', null);
            }

            // ─── DISPLAY QUESTION ──────────────────────────────────
            function displayQuestion(index) {
                if (autoAdvanceTimer) {
                    clearTimeout(autoAdvanceTimer);
                    autoAdvanceTimer = null;
                }

                if (index >= shuffledQuestions.length) {
                    // ── END OF QUIZ ──
                    // Hide everything except the results panel
                    isComplete = true;
                    card.classList.add('quiz-finished');
                    questionEl.innerHTML = '<i class="fa-solid fa-flag-checkered" aria-hidden="true"></i> You finished the quiz!';
                    knowBtn.disabled = true;
                    dontKnowBtn.disabled = true;
                    spoilerToggle.disabled = true;
                    spoilerContainer.classList.remove('revealed');
                    spoilerToggle.textContent = 'Show answer';
                    spoilerVisible = false;
                    progressNum.textContent = shuffledQuestions.length;
                    showSummary();
                    return;
                }

                // ── REGULAR QUESTION ──
                card.classList.remove('quiz-finished');
                hideSummary();
                spoilerContainer.style.display = '';
                const q = shuffledQuestions[index];
                questionEl.textContent = normalizeAnswer(q.question);
                updateSpoiler(q.answer);

                knowBtn.disabled = false;
                dontKnowBtn.disabled = false;
                spoilerToggle.disabled = false;
                resetFeedback();
                updateProgress();
            }

            function advanceToNext() {
                if (isComplete) return;
                currentIndex++;
                displayQuestion(currentIndex);
            }

            // ─── ANSWER ACTIONS ────────────────────────────────────
            function markKnown() {
                if (autoAdvanceTimer) {
                    clearTimeout(autoAdvanceTimer);
                    autoAdvanceTimer = null;
                }
                if (isComplete) return;
                if (currentIndex >= shuffledQuestions.length) return;

                setFeedback('fa-check-circle', 'Marked as known. Moving on…', 'correct');
                knowBtn.disabled = true;
                dontKnowBtn.disabled = true;

                autoAdvanceTimer = setTimeout(function() {
                    autoAdvanceTimer = null;
                    advanceToNext();
                }, 400);
            }

            function markUnknown() {
                if (autoAdvanceTimer) {
                    clearTimeout(autoAdvanceTimer);
                    autoAdvanceTimer = null;
                }
                if (isComplete) return;
                if (currentIndex >= shuffledQuestions.length) return;

                const current = shuffledQuestions[currentIndex];
                failures.push({
                    question: normalizeAnswer(current.question),
                    answer:   normalizeAnswer(current.answer)
                });

                setFeedback('fa-times-circle', 'Recorded as not known. Moving on…', 'wrong');
                knowBtn.disabled = true;
                dontKnowBtn.disabled = true;

                autoAdvanceTimer = setTimeout(function() {
                    autoAdvanceTimer = null;
                    advanceToNext();
                }, 400);
            }

            // ─── RESTART ───────────────────────────────────────────
            function restartQuiz() {
                if (autoAdvanceTimer) {
                    clearTimeout(autoAdvanceTimer);
                    autoAdvanceTimer = null;
                }
                if (ALL_QUESTIONS.length === 0) {
                    showEmptyState();
                    return;
                }
                failures = [];
                card.classList.remove('quiz-finished');
                hideSummary();
                spoilerContainer.style.display = '';
                shuffledQuestions = shuffleArray([...ALL_QUESTIONS]);
                currentIndex = 0;
                isComplete = false;
                displayQuestion(0);
            }

            // ─── LOAD QUESTIONS FROM DATA ──────────────────────────
            function loadQuestionsFromData(data, sourceName) {
                let arr = [];
                let language = '';

                if (Array.isArray(data)) {
                    arr = data;
                } else if (data && Array.isArray(data.questions)) {
                    arr = data.questions;
                    language = (typeof data.language === 'string') ? data.language : '';
                } else {
                    throw new Error('Invalid format. Expected an array or { language, questions: [...] }.');
                }

                const valid = arr.filter(function(q) {
                    return q &&
                        typeof q.question === 'string' &&
                        (typeof q.answer === 'string' || Array.isArray(q.answer)) &&
                        q.question.trim().length > 0;
                });

                if (valid.length === 0) {
                    throw new Error('No valid questions found in this file.');
                }

                ALL_QUESTIONS = valid;
                failures = [];
                card.classList.remove('quiz-finished');
                hideSummary();
                spoilerContainer.style.display = '';
                totalNum.textContent = ALL_QUESTIONS.length;
                applyLanguageFont(language);

                shuffledQuestions = shuffleArray([...ALL_QUESTIONS]);
                currentIndex = 0;
                isComplete = false;
                displayQuestion(0);
            }

            // ─── LOAD A QUIZ (from cache or fresh fetch) ───────────
            function loadQuiz(filename) {
                for (const cat in QUIZ_TREE) {
                    if (QUIZ_TREE[cat].some(function(q) { return q.file === filename; })) {
                        currentCategory = cat;
                        break;
                    }
                }
                currentFile = filename;

                if (QUIZ_CACHE[filename] && QUIZ_CACHE[filename].data) {
                    loadQuestionsFromData(QUIZ_CACHE[filename].data, filename);
                } else {
                    fetchJsonFile(filename);
                }
            }

            // ─── FETCH JSON FILE (fresh, bypass cache) ─────────────
            function fetchJsonFile(filename) {
                knowBtn.disabled = true;
                dontKnowBtn.disabled = true;

                fetch(JSON_DIR + filename, { cache: 'no-store' })
                    .then(function(res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(function(data) {
                        const title = (data && typeof data.title === 'string' && data.title.trim())
                            ? data.title.trim()
                            : filename.replace(/\.json$/i, '');

                        QUIZ_CACHE[filename] = { data: data, title: title, error: null };

                        for (const cat in QUIZ_TREE) {
                            const entry = QUIZ_TREE[cat].find(function(q) {
                                return q.file === filename;
                            });
                            if (entry) {
                                entry.title = title;
                                entry.error = null;
                                break;
                            }
                        }

                        currentFile = filename;
                        loadQuestionsFromData(data, filename);
                    })
                    .catch(function(err) {
                        console.error(err);
                        card.classList.remove('font-vazir', 'font-jp');
                        showEmptyState('Failed to load ' + filename);
                        setFeedback('fa-exclamation-circle', 'Could not load ' + filename + ': ' + err.message, 'wrong');
                    });
            }

            // ─── LOAD MANIFEST + PRELOAD + FIRST QUIZ ──────────────
            async function loadManifestAndFirstQuiz() {
                QUIZ_CACHE = {};
                QUIZ_TREE = {};
                HAS_CATEGORIES = false;
                currentFile = '';
                currentCategory = '';
                renderPickerLoading('Loading manifest…');

                try {
                    const res = await fetch(MANIFEST_URL, { cache: 'no-store' });
                    if (!res.ok) throw new Error('HTTP ' + res.status + ' for manifest.json');
                    const manifest = await res.json();

                    const entries = normalizeManifest(manifest);
                    if (entries.length === 0) {
                        throw new Error('manifest.json must contain a non-empty "files" array.');
                    }

                    renderPickerLoading('Loading quizzes…');
                    await preloadAllQuizzes(entries);

                    buildQuizTree(entries);
                    renderPickerInitial();

                    const firstGood = entries.find(function(e) {
                        return QUIZ_CACHE[e.file] && QUIZ_CACHE[e.file].data;
                    });

                    if (firstGood) {
                        currentFile = firstGood.file;
                        loadQuestionsFromData(QUIZ_CACHE[firstGood.file].data, firstGood.file);
                    } else {
                        showEmptyState('No quizzes could be loaded');
                        setFeedback('fa-exclamation-circle', 'All quiz files failed to load.', 'wrong');
                    }
                } catch (err) {
                    console.error(err);
                    renderPickerLoading('— error —');
                    showEmptyState('Could not read json/manifest.json');
                    setFeedback(
                        'fa-exclamation-circle',
                        'Manifest error: ' + err.message +
                        '<span class="detail">Run from a server (not file://) and make sure json/manifest.json exists.</span>',
                        'wrong'
                    );
                }
            }

            // ─── EVENTS ────────────────────────────────────────────
            knowBtn.addEventListener('click', markKnown);
            dontKnowBtn.addEventListener('click', markUnknown);
            resetBtn.addEventListener('click', restartQuiz);
            summaryRestartBtn.addEventListener('click', restartQuiz);
            spoilerToggle.addEventListener('click', toggleSpoiler);

            reloadBtn.addEventListener('click', function() {
                cancelClose();
                closePicker();
                if (currentFile) {
                    fetchJsonFile(currentFile);
                } else {
                    loadManifestAndFirstQuiz();
                }
            });

            // ─── INIT ──────────────────────────────────────────────
            card.classList.remove('font-vazir', 'font-jp', 'quiz-finished');
            showEmptyState('Loading quiz…');
            loadManifestAndFirstQuiz();

        })();
    </script>
