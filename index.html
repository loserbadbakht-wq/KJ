<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz · JSON Loader</title>

    <style>
        /* ---------- LOCAL FONTS ---------- */
        @font-face {
            font-family: 'Vazir';
            src: url('fonts/Vazir.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazir Bold';
            src: url('fonts/Vazir-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        /* ---------- RESET & BASE ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 18px;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
            margin: 0;
        }

        /* ---------- MAIN CARD ---------- */
        .card {
            max-width: 720px;
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 2.2rem;
            padding: 2rem 2.8rem 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9),
                0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            transition: border-color 0.3s ease;
            animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .card:hover {
            border-color: #262626;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ---------- LOADER BAR ---------- */
        .load-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            padding-bottom: 1.2rem;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #161616;
        }

        .load-bar label {
            font-size: 0.8rem;
            color: #8a8a8a;
            font-weight: 500;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .quiz-select {
            flex: 1;
            min-width: 160px;
            padding: 0.55rem 1rem;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            color: #c4b5fd;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 1rem;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .quiz-select:hover:not(:disabled) {
            border-color: #a78bfa;
            background: #25254a;
        }

        .quiz-select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .load-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1.1rem;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            color: #c4b5fd;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .load-btn:hover {
            background: #25254a;
            border-color: #a78bfa;
            color: #ddd6fe;
            transform: translateY(-1px);
        }

        .load-btn:active {
            transform: translateY(0);
        }

        .load-info {
            font-size: 0.78rem;
            color: #5a5a5a;
            flex-basis: 100%;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color 0.3s ease;
        }

        .load-info.loaded {
            color: #6ee7b7;
        }

        .load-info.error {
            color: #fca5a5;
        }

        /* ---------- PROGRESS ---------- */
        .progress {
            color: #5a5a5a;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1.8rem;
            text-align: center;
            font-weight: 500;
        }

        .progress span {
            color: #a78bfa;
            font-weight: 700;
        }

        /* ---------- QUESTION (default = system font) ---------- */
        .question {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.6;
            letter-spacing: -0.02em;
            margin-bottom: 2.2rem;
            text-align: center;
            white-space: pre-wrap;
            min-height: 3.5rem;

            background: linear-gradient(135deg, #a78bfa, #34d399);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradShift 5s ease-in-out infinite alternate;
            transition: filter 0.3s ease;

            dir: auto;
        }

        @keyframes gradShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .question::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            margin: 1.2rem auto 0;
            border-radius: 4px;
            background: linear-gradient(90deg, #a78bfa, #34d399);
            background-size: 200% 200%;
            animation: gradShift 5s ease-in-out infinite alternate;
            opacity: 0.35;
        }

        /* ---------- INPUT (default = system font) ---------- */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.8rem;
        }

        .input-group label {
            color: #8a8a8a;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            padding-left: 0.2rem;
        }

        .input-group textarea {
            width: 100%;
            padding: 1rem 1.4rem;
            font-size: 1.15rem;
            font-weight: 500;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #f0f0f0;
            background: #121212;
            border: 2px solid #2a2a2a;
            border-radius: 1.4rem;
            outline: none;
            transition: border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
            caret-color: #a78bfa;
            autocomplete: on;
            spellcheck: true;
            inputmode: text;
            dir: auto;
            resize: vertical;
            min-height: 80px;
            line-height: 1.6;
        }

        .input-group textarea::placeholder {
            color: #4a4a4a;
            font-weight: 400;
            font-size: 1rem;
            opacity: 0.7;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .input-group textarea:focus {
            border-color: #a78bfa;
            background: #181818;
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.12);
        }

        .input-group textarea:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ---------- SPOILER ---------- */
        .spoiler-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.8rem;
            padding: 0.2rem 0;
            flex-wrap: wrap;
        }

        .spoiler-toggle {
            background: none;
            border: 1px solid #3a3a3a;
            color: #8a8a8a;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            white-space: nowrap;
        }

        .spoiler-toggle:hover:not(:disabled) {
            border-color: #a78bfa;
            color: #a78bfa;
            background: rgba(167, 139, 250, 0.08);
        }

        .spoiler-toggle:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .spoiler-answer {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 1.05rem;
            font-weight: 500;
            color: #c4b5fd;
            background: #1a1a2e;
            padding: 0.6rem 1.4rem;
            border-radius: 1.2rem;
            border: 1px solid #2a2a4a;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            white-space: pre-wrap;
            line-height: 1.6;
            max-width: 100%;
            word-break: break-word;
            dir: auto;
        }

        .spoiler-answer.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* ---------- VAZIR FONT (only for Persian / Arabic) ---------- */
        .card.font-vazir .question {
            font-family: 'Vazir Bold', 'Segoe UI', system-ui, sans-serif;
        }

        .card.font-vazir .input-group textarea {
            font-family: 'Vazir', 'Segoe UI', system-ui, sans-serif;
        }

        .card.font-vazir .spoiler-answer {
            font-family: 'Vazir', 'Segoe UI', system-ui, sans-serif;
        }

        /* ---------- BUTTONS ---------- */
        .btn-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 100px;
            padding: 1rem 1.8rem;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: inherit;
            color: #ffffff;
            border: none;
            border-radius: 1.6rem;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.3s ease,
                opacity 0.3s ease;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .btn:hover:not(:disabled)::after {
            opacity: 1;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 30px rgba(167, 139, 250, 0.22);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn span {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .btn-submit {
            background: linear-gradient(135deg, #7c3aed, #059669);
        }
        .btn-submit::after {
            background: linear-gradient(135deg, #6d28d9, #047857);
        }

        .btn-skip {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        .btn-skip::after {
            background: linear-gradient(135deg, #d97706, #b45309);
        }

        .btn-reset {
            background: linear-gradient(135deg, #6b7280, #4b5563);
        }
        .btn-reset::after {
            background: linear-gradient(135deg, #4b5563, #374151);
        }

        /* ---------- FEEDBACK ---------- */
        .feedback {
            margin-top: 1.8rem;
            padding: 1.2rem 1.6rem;
            border-radius: 1.4rem;
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.5;
            min-height: 4.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: #0e0e0e;
            border: 1px solid #1e1e1e;
            color: #b0b0b0;
            transition: border-color 0.4s ease,
                background 0.4s ease,
                color 0.4s ease;
        }

        .feedback.correct {
            background: #0a1a0f;
            border-color: #34d399;
            color: #6ee7b7;
        }

        .feedback.wrong {
            background: #1a0a0a;
            border-color: #f87171;
            color: #fca5a5;
        }

        .feedback.skip {
            background: #1a1a0a;
            border-color: #f59e0b;
            color: #fcd34d;
        }

        .feedback.done {
            background: #0f172a;
            border-color: #a78bfa;
            color: #c4b5fd;
        }

        .feedback .icon {
            font-size: 1.6rem;
            flex-shrink: 0;
            line-height: 1;
        }

        .feedback .msg {
            flex: 1;
        }

        .feedback .detail {
            font-size: 0.8rem;
            font-weight: 400;
            opacity: 0.6;
            margin-top: 0.2rem;
            display: block;
        }

        /* ---------- HINT ---------- */
        .hint {
            margin-top: 1.2rem;
            font-size: 0.78rem;
            color: #3a3a3a;
            text-align: center;
            border-top: 1px solid #161616;
            padding-top: 1.2rem;
        }

        .hint strong {
            color: #5a5a5a;
            font-weight: 600;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 540px) {
            .card {
                padding: 1.6rem 1.4rem 2rem;
                border-radius: 1.6rem;
            }
            .question {
                font-size: 1.6rem;
            }
            .input-group textarea {
                font-size: 1rem;
                padding: 0.85rem 1.2rem;
                min-height: 70px;
            }
            .btn {
                font-size: 1rem;
                padding: 0.85rem 1.4rem;
                min-width: 80px;
            }
            .feedback {
                font-size: 0.95rem;
                padding: 1rem 1.2rem;
                min-height: 3.6rem;
            }
            .btn-row {
                flex-direction: column;
            }
            .spoiler-container {
                flex-direction: column;
                align-items: stretch;
            }
            .spoiler-answer {
                text-align: center;
            }
            .load-info {
                text-align: left;
            }
            .load-bar label {
                flex-basis: 100%;
            }
        }

        @media (max-width: 380px) {
            .question {
                font-size: 1.3rem;
            }
            .card {
                padding: 1.2rem 1rem 1.6rem;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <main class="card" id="quizCard" role="main" aria-labelledby="question-heading">

        <!-- Loader bar -->
        <div class="load-bar">
            <label for="quizSelect">Quiz file:</label>
            <select class="quiz-select" id="quizSelect" disabled>
                <option value="">Loading…</option>
            </select>
            <button class="load-btn" id="reloadBtn" type="button">🔄 Reload</button>
            <span class="load-info" id="loadInfo">Loading…</span>
        </div>

        <div class="progress" id="progressDisplay">
            Question <span id="currentNum">0</span> of <span id="totalNum">0</span>
        </div>

        <h1 id="question-heading" class="question" dir="auto">Loading…</h1>

        <div class="input-group">
            <label for="answerInput">Your answer</label>
            <textarea
            id="answerInput"
            placeholder="Type your answer here…"
            autocomplete="on"
            spellcheck="true"
            inputmode="text"
            dir="auto"
            rows="3"
            aria-describedby="feedbackArea"
            ></textarea>
        </div>

        <!-- Spoiler -->
        <div class="spoiler-container">
            <button class="spoiler-toggle" id="spoilerToggle" type="button">Show answer</button>
            <span class="spoiler-answer" id="spoilerAnswer"></span>
        </div>

        <div class="btn-row">
            <button class="btn btn-submit" id="submitBtn" type="button">
                <span>✓ Submit</span>
            </button>
            <button class="btn btn-skip" id="skipBtn" type="button">
                <span>⏭️ Skip</span>
            </button>
            <button class="btn btn-reset" id="resetBtn" type="button">
                <span>↻ Restart</span>
            </button>
        </div>

        <div class="feedback" id="feedbackArea" role="status" aria-live="polite">
            <span class="icon">📂</span>
            <span class="msg">Waiting for quiz files…</span>
        </div>

        <div class="hint">
            <strong>⏺ Exact match</strong> &nbsp;·&nbsp; case-sensitive &nbsp;·&nbsp; no extra spaces
            <br />
            <span style="opacity:0.5; font-size:0.7rem;">Press Enter for a new line. Submit with the button or Shift+Enter.</span>
        </div>

    </main>

    <script>
        (function() {
            'use strict';

            // ─── CONFIG ────────────────────────────────────────────
            const MANIFEST_URL = 'json/manifest.json';
            const JSON_DIR = 'json/';

            // Languages that should use the Vazir (Persian/Arabic) font
            const VAZIR_LANGS = ['fa', 'ar', 'he', 'ur', 'ps'];

            // ─── DOM REFS ──────────────────────────────────────────
            const card         = document.getElementById('quizCard');
            const questionEl   = document.getElementById('question-heading');
            const progressNum  = document.getElementById('currentNum');
            const totalNum     = document.getElementById('totalNum');
            const inputEl      = document.getElementById('answerInput');
            const submitBtn    = document.getElementById('submitBtn');
            const skipBtn      = document.getElementById('skipBtn');
            const resetBtn     = document.getElementById('resetBtn');
            const feedbackEl   = document.getElementById('feedbackArea');
            const spoilerToggle= document.getElementById('spoilerToggle');
            const spoilerAnswer= document.getElementById('spoilerAnswer');
            const quizSelect   = document.getElementById('quizSelect');
            const reloadBtn    = document.getElementById('reloadBtn');
            const loadInfo     = document.getElementById('loadInfo');

            // ─── STATE ─────────────────────────────────────────────
            let ALL_QUESTIONS = [];
            let shuffledQuestions = [];
            let currentIndex = 0;
            let isComplete = false;
            let autoAdvanceTimer = null;
            let spoilerVisible = false;
            let currentFile = '';
            let currentLanguage = '';

            // ─── HELPERS ───────────────────────────────────────────
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function setFeedback(icon, message, type) {
                feedbackEl.classList.remove('correct', 'wrong', 'skip', 'done');
                const iconSpan = feedbackEl.querySelector('.icon');
                if (iconSpan) iconSpan.textContent = icon;
                const msgSpan = feedbackEl.querySelector('.msg');
                if (msgSpan) msgSpan.innerHTML = message;
                if (type) feedbackEl.classList.add(type);
            }

            function resetFeedback() {
                setFeedback('⏳', 'Type your answer and submit.', null);
            }

            function updateProgress() {
                progressNum.textContent = Math.min(currentIndex + 1, shuffledQuestions.length);
                totalNum.textContent = shuffledQuestions.length;
            }

            // ─── LANGUAGE / FONT HANDLING ──────────────────────────
            function applyLanguageFont(language) {
                const lang = (language || '').toLowerCase().trim();
                const useVazir = VAZIR_LANGS.indexOf(lang) !== -1;
                if (useVazir) {
                    card.classList.add('font-vazir');
                } else {
                    card.classList.remove('font-vazir');
                }
                return useVazir;
            }

            // ─── SPOILER ───────────────────────────────────────────
            function updateSpoiler(answer) {
                spoilerAnswer.textContent = answer;
                spoilerAnswer.classList.remove('visible');
                spoilerToggle.textContent = 'Show answer';
                spoilerVisible = false;
            }

            function toggleSpoiler() {
                if (spoilerVisible) {
                    spoilerAnswer.classList.remove('visible');
                    spoilerToggle.textContent = 'Show answer';
                } else {
                    spoilerAnswer.classList.add('visible');
                    spoilerToggle.textContent = 'Hide answer';
                }
                spoilerVisible = !spoilerVisible;
            }

            // ─── EMPTY STATE ───────────────────────────────────────
            function showEmptyState(message) {
                questionEl.textContent = message || 'Load a quiz file to begin';
                progressNum.textContent = '0';
                totalNum.textContent = '0';
                inputEl.value = '';
                inputEl.disabled = true;
                submitBtn.disabled = true;
                skipBtn.disabled = true;
                spoilerToggle.disabled = true;
                spoilerAnswer.classList.remove('visible');
                spoilerToggle.textContent = 'Show answer';
                spoilerVisible = false;
                setFeedback('📂', 'No quiz loaded.', null);
            }

            // ─── DISPLAY QUESTION ──────────────────────────────────
            function displayQuestion(index) {
                if (autoAdvanceTimer) {
                    clearTimeout(autoAdvanceTimer);
                    autoAdvanceTimer = null;
                }

                if (index >= shuffledQuestions.length) {
                    isComplete = true;
                    questionEl.textContent = '🎉 You finished the quiz!';
                    inputEl.disabled = true;
                    submitBtn.disabled = true;
                    skipBtn.disabled = true;
                    spoilerToggle.disabled = true;
                    setFeedback('🏁', 'All questions completed.<span class="detail">Click Restart to try again.</span>', 'done');
                    progressNum.textContent = shuffledQuestions.length;
                    spoilerAnswer.classList.remove('visible');
                    spoilerToggle.textContent = 'Show answer';
                    spoilerVisible = false;
                    return;
                }

                const q = shuffledQuestions[index];
                questionEl.textContent = q.question;
                updateSpoiler(q.answer);

                inputEl.value = '';
                inputEl.disabled = false;
                inputEl.style.borderColor = '#2a2a2a';
                inputEl.style.boxShadow = 'none';
                submitBtn.disabled = false;
                skipBtn.disabled = false;
                spoilerToggle.disabled = false;
                resetFeedback();
                updateProgress();
                inputEl.focus();
            }

            function advanceToNext() {
                if (isComplete) return;
                currentIndex++;
                displayQuestion(currentIndex);
            }

            // ─── CHECK ANSWER ──────────────────────────────────────
            function checkAnswer() {
                if (autoAdvanceTimer) {
                    clearTimeout(autoAdvanceTimer);
                    autoAdvanceTimer = null;
                }
                if (isComplete) return;
                if (currentIndex >= shuffledQuestions.length) return;

                const trimmed = inputEl.value.trim();
                const current = shuffledQuestions[currentIndex];

                if (trimmed.length === 0) {
                    setFeedback('✏️', 'Please type an answer before submitting.', null);
                    return;
                }

                const isCorrect = (trimmed === current.answer);

                if (isCorrect) {
                    setFeedback('✅', 'Correct! Moving on…', 'correct');
                    inputEl.style.borderColor = '#34d399';
                    inputEl.style.boxShadow = '0 0 0 4px rgba(52, 211, 153, 0.15)';
                    inputEl.disabled = true;
                    submitBtn.disabled = true;
                    skipBtn.disabled = true;

                    autoAdvanceTimer = setTimeout(function() {
                        autoAdvanceTimer = null;
                        advanceToNext();
                    }, 600);
                } else {
                    let hintMsg = 'Incorrect. Please try again.';
                    if (trimmed.toLowerCase() === current.answer.toLowerCase()) {
                        hintMsg += ' <span style="opacity:0.7;">(Check capitalization.)</span>';
                    }
                    setFeedback('❌', hintMsg, 'wrong');
                    inputEl.style.borderColor = '#f87171';
                    inputEl.style.boxShadow = '0 0 0 4px rgba(248, 113, 113, 0.15)';
                    inputEl.focus();
                    inputEl.select();
                }
            }

            // ─── SKIP ──────────────────────────────────────────────
            function skipQuestion() {
                if (autoAdvanceTimer) {
                    clearTimeout(autoAdvanceTimer);
                    autoAdvanceTimer = null;
                }
                if (isComplete) return;
                if (currentIndex >= shuffledQuestions.length) return;

                setFeedback('⏭️', 'Skipped! Moving on…', 'skip');
                inputEl.style.borderColor = '#f59e0b';
                inputEl.style.boxShadow = '0 0 0 4px rgba(245, 158, 11, 0.15)';
                inputEl.disabled = true;
                submitBtn.disabled = true;
                skipBtn.disabled = true;

                autoAdvanceTimer = setTimeout(function() {
                    autoAdvanceTimer = null;
                    advanceToNext();
                }, 600);
            }

            // ─── RESTART ───────────────────────────────────────────
            function restartQuiz() {
                if (autoAdvanceTimer) {
                    clearTimeout(autoAdvanceTimer);
                    autoAdvanceTimer = null;
                }
                if (ALL_QUESTIONS.length === 0) {
                    showEmptyState();
                    return;
                }
                shuffledQuestions = shuffleArray([...ALL_QUESTIONS]);
                currentIndex = 0;
                isComplete = false;
                displayQuestion(0);
            }

            // ─── LOAD QUESTIONS FROM DATA ──────────────────────────
            function loadQuestionsFromData(data, sourceName) {
                let arr = [];
                let language = '';

                if (Array.isArray(data)) {
                    arr = data;
                } else if (data && Array.isArray(data.questions)) {
                    arr = data.questions;
                    language = (typeof data.language === 'string') ? data.language : '';
                } else {
                    throw new Error('Invalid format. Expected an array or { language, questions: [...] }.');
                }

                const valid = arr.filter(q =>
                    q && typeof q.question === 'string' &&
                    typeof q.answer === 'string' &&
                    q.question.trim().length > 0
                );

                if (valid.length === 0) {
                    throw new Error('No valid questions found in this file.');
                }

                ALL_QUESTIONS = valid;
                currentLanguage = language;
                totalNum.textContent = ALL_QUESTIONS.length;

                // Apply font based on language
                const useVazir = applyLanguageFont(language);

                // Status text
                const langLabel = language ? language : 'default';
                const fontLabel = useVazir ? 'Vazir' : 'system';
                loadInfo.textContent = `✓ ${sourceName} · ${ALL_QUESTIONS.length} questions · [${langLabel}] ${fontLabel} font`;
                loadInfo.classList.remove('error');
                loadInfo.classList.add('loaded');

                shuffledQuestions = shuffleArray([...ALL_QUESTIONS]);
                currentIndex = 0;
                isComplete = false;
                displayQuestion(0);
            }

            // ─── FETCH A JSON FILE FROM json/ ──────────────────────
            function fetchJsonFile(filename) {
                const url = JSON_DIR + filename;
                loadInfo.textContent = `⏳ Loading ${filename}…`;
                loadInfo.classList.remove('error', 'loaded');
                inputEl.disabled = true;
                submitBtn.disabled = true;
                skipBtn.disabled = true;

                fetch(url, { cache: 'no-store' })
                    .then(function(res) {
                        if (!res.ok) throw new Error(`HTTP ${res.status} for ${filename}`);
                        return res.json();
                    })
                    .then(function(data) {
                        currentFile = filename;
                        loadQuestionsFromData(data, filename);
                    })
                    .catch(function(err) {
                        console.error(err);
                        loadInfo.textContent = `✗ ${err.message}`;
                        loadInfo.classList.remove('loaded');
                        loadInfo.classList.add('error');
                        // Reset font class on error
                        card.classList.remove('font-vazir');
                        showEmptyState('Failed to load ' + filename);
                        setFeedback('⚠️', 'Could not load ' + filename + ': ' + err.message, 'wrong');
                    });
            }

            // ─── LOAD MANIFEST & POPULATE SELECT ───────────────────
            function loadManifestAndFirstQuiz() {
                loadInfo.textContent = '⏳ Reading manifest…';
                loadInfo.classList.remove('error', 'loaded');

                fetch(MANIFEST_URL, { cache: 'no-store' })
                    .then(function(res) {
                        if (!res.ok) throw new Error(`HTTP ${res.status} for manifest.json`);
                        return res.json();
                    })
                    .then(function(manifest) {
                        if (!manifest || !Array.isArray(manifest.files) || manifest.files.length === 0) {
                            throw new Error('manifest.json must contain a non-empty "files" array.');
                        }

                        quizSelect.innerHTML = '';
                        manifest.files.forEach(function(fname) {
                            const opt = document.createElement('option');
                            opt.value = fname;
                            opt.textContent = fname;
                            quizSelect.appendChild(opt);
                        });
                        quizSelect.disabled = false;

                        const first = manifest.files[0];
                        quizSelect.value = first;
                        fetchJsonFile(first);
                    })
                    .catch(function(err) {
                        console.error(err);
                        loadInfo.textContent = '✗ ' + err.message;
                        loadInfo.classList.remove('loaded');
                        loadInfo.classList.add('error');
                        quizSelect.innerHTML = '<option value="">— no files —</option>';
                        quizSelect.disabled = true;
                        showEmptyState('Could not read json/manifest.json');
                        setFeedback('⚠️', 'Manifest error: ' + err.message + '<span class="detail">Run from a server (not file://) and make sure json/manifest.json exists.</span>', 'wrong');
                    });
            }

            // ─── EVENT LISTENERS ───────────────────────────────────
            submitBtn.addEventListener('click', checkAnswer);
            skipBtn.addEventListener('click', skipQuestion);
            resetBtn.addEventListener('click', restartQuiz);
            spoilerToggle.addEventListener('click', toggleSpoiler);

            quizSelect.addEventListener('change', function() {
                const fname = quizSelect.value;
                if (fname) fetchJsonFile(fname);
            });

            reloadBtn.addEventListener('click', function() {
                if (currentFile) {
                    fetchJsonFile(currentFile);
                } else {
                    loadManifestAndFirstQuiz();
                }
            });

            inputEl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.shiftKey || e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    if (!submitBtn.disabled) checkAnswer();
                }
            });

            inputEl.addEventListener('input', function() {
                if (feedbackEl.classList.contains('wrong')) {
                    resetFeedback();
                }
                if (inputEl.style.borderColor !== '#2a2a2a' &&
                    inputEl.style.borderColor !== '#34d399' &&
                    inputEl.style.borderColor !== '#f59e0b') {
                    inputEl.style.borderColor = '#2a2a2a';
                    inputEl.style.boxShadow = 'none';
                }
                if ((feedbackEl.classList.contains('correct') || feedbackEl.classList.contains('skip')) && !inputEl.disabled) {
                    inputEl.disabled = true;
                }
            });

            // ─── INIT ──────────────────────────────────────────────
            // No Vazir font until a Persian/Arabic quiz is loaded
            card.classList.remove('font-vazir');
            showEmptyState('Loading quiz…');
            loadManifestAndFirstQuiz();

        })();
    </script>

</body>
