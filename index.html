<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz · FMHY Theme</title>

    <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.2.0/audio.js"></script>

    <style>
        @font-face { font-family: 'Inter'; font-style: normal; font-weight: 1 999; src: url('https://raw.githubusercontent.com/loserbadbakht-wq/shs/refs/heads/main/Inter-VariableFont_opsz,wght.ttf') format('truetype-variations'); font-display: swap; }
        @font-face { font-family: 'Vazir'; src: url('fonts/Vazir.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Vazir Bold'; src: url('fonts/Vazir-Bold.ttf') format('truetype'); font-weight: bold; font-style: normal; font-display: swap; }
        @font-face { font-family: 'BIZ UDPMincho'; src: url('fonts/BIZUDPMincho-Regular.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
        @font-face { font-family: 'BIZ UDPMincho Bold'; src: url('fonts/BIZUDPMincho-Bold.ttf') format('truetype'); font-weight: bold; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Font Awesome 6 Free'; font-style: normal; font-weight: 900; src: url('fonts/fa-solid-900.ttf') format('truetype'); font-display: block; }
        .fas, .fa-solid { font-family: 'Font Awesome 6 Free'; font-weight: 900; display: inline-block; font-style: normal; font-variant: normal; text-rendering: auto; line-height: 1; width: 1em; text-align: center; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

        .fa-graduation-cap::before { content: "\f19d"; }
        .fa-book::before { content: "\f02d"; }
        .fa-sync-alt::before { content: "\f2f1"; }
        .fa-undo::before { content: "\f0e2"; }
        .fa-check::before { content: "\f00c"; }
        .fa-times::before { content: "\f00d"; }
        .fa-folder-open::before { content: "\f07c"; }
        .fa-hourglass-half::before { content: "\f252"; }
        .fa-check-circle::before { content: "\f058"; }
        .fa-times-circle::before { content: "\f057"; }
        .fa-flag-checkered::before { content: "\f11e"; }
        .fa-exclamation-circle::before { content: "\f06a"; }
        .fa-list-ul::before { content: "\f0ca"; }
        .fa-trophy::before { content: "\f091"; }
        .fa-chevron-right::before { content: "\f054"; }
        .fa-chevron-down::before { content: "\f078"; }
        .fa-dumbbell::before { content: "\f44b"; }
        .fa-home::before { content: "\f015"; }
        .fa-circle::before { content: "\f111"; }
        .fa-arrow-left::before { content: "\f060"; }
        .fa-music::before { content: "\f001"; }
        .fa-backward-step::before { content: "\f048"; }
        .fa-forward-step::before { content: "\f051"; }
        .fa-shuffle::before { content: "\f074"; }

        :root {
            --bg: #0c0c0c; --bg-card: #161616; --bg-input: #1e1e1e; --bg-hover: #242424;
            --text: #e6e6e6; --text-secondary: #9a9a9a; --text-muted: #5a5a5a;
            --border: #262626; --border-hover: #383838;
            --primary: #00d4ff; --primary-hover: #40e0ff; --primary-light: #0a2833;
            --danger: #ef4444; --danger-light: rgba(239,68,68,.1); --success: #22c55e;
            --shadow: 0 8px 32px rgba(0,0,0,.6); --radius: 10px; --radius-sm: 6px;
            --transition: .2s ease;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --header-height: 56px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 17px; -webkit-font-smoothing: antialiased; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; transition: background var(--transition), color var(--transition); display: flex; flex-direction: column; background-image: radial-gradient(circle at 20% 30%, rgba(0,212,255,.04) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(0,212,255,.03) 0%, transparent 50%); background-attachment: fixed; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 20px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0 24px; height: var(--header-height); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; letter-spacing: -.3px; }
        .header-logo i { font-size: 22px; }
        .header-logo span { color: var(--text-secondary); font-weight: 400; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .header-actions .btn-icon { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--transition); }
        .header-actions .btn-icon:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--border-hover); color: var(--text); }
        .header-actions .btn-icon:disabled { opacity: .35; cursor: not-allowed; }

        /* ─── MUSIC PANEL ─── */
        .music-panel-wrap { position: relative; display: inline-flex; }
        .music-panel {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: 360px;
            max-width: calc(100vw - 24px);
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            padding: 12px;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px) scale(.97);
            transform-origin: top right;
            transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s;
        }
        .music-panel.open { opacity: 1; visibility: visible; transform: translateY(0) scale(1); transition: opacity .18s ease, transform .18s ease, visibility 0s linear 0s; }

        .music-panel-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
        .music-panel-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
        .music-close { width: 28px; height: 28px; border-radius: 50%; background: transparent; border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all var(--transition); flex-shrink: 0; }
        .music-close:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border-hover); }

        /* ─── PLAYLIST SELECTOR (button + dropdown) ─── */
        .music-playlist-selector {
            position: relative;
            margin-bottom: 12px;
        }
        .music-playlist-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            padding: 9px 12px;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text);
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            text-align: left;
        }
        .music-playlist-trigger:hover:not(:disabled) {
            background: var(--bg-hover);
            border-color: var(--border-hover);
        }
        .music-playlist-trigger:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .music-playlist-trigger.open {
            border-color: var(--primary);
            background: var(--bg-hover);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }
        .music-playlist-trigger-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        .music-playlist-trigger-arrow {
            font-size: 10px;
            color: var(--text-muted);
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }
        .music-playlist-trigger.open .music-playlist-trigger-arrow {
            transform: rotate(180deg);
            color: var(--primary);
        }

        .music-playlist-menu {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            padding: 4px;
            z-index: 20;
            max-height: 240px;
            overflow-y: auto;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-4px) scale(0.98);
            transform-origin: top center;
            transition: opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0.15s;
        }
        .music-playlist-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            transition: opacity 0.15s ease, transform 0.15s ease, visibility 0s linear 0s;
        }
        .music-playlist-menu::-webkit-scrollbar { width: 4px; }
        .music-playlist-menu::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 20px; }

        .music-playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            transition: background var(--transition);
            width: 100%;
        }
        .music-playlist-item:hover { background: var(--bg-hover); }
        .music-playlist-item.active { background: var(--primary-light); }

        .music-playlist-cover {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            color: var(--text-muted);
            font-size: 11px;
            border: 1px solid var(--border);
        }
        .music-playlist-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .music-playlist-item.active .music-playlist-cover {
            border-color: rgba(0, 212, 255, 0.4);
        }

        .music-playlist-name {
            flex: 1;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        .music-playlist-item.active .music-playlist-name {
            color: var(--primary);
            font-weight: 600;
        }

        .music-playlist-empty {
            padding: 14px 10px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            font-style: italic;
        }

        /* ─── SONG SECTION ─── */
        .music-song {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .music-now-playing { display: flex; align-items: center; gap: 12px; min-height: 56px; }
        .music-cover { width: 56px; height: 56px; border-radius: var(--radius-sm); background: var(--bg-input); object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); display: block; }
        .music-info { flex: 1; min-width: 0; }
        .music-title { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .music-artist { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-controls { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .music-ctrl { width: 34px; height: 34px; border-radius: 50%; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all var(--transition); }
        .music-ctrl:hover:not(:disabled) { background: var(--bg-hover); color: var(--text); border-color: var(--border-hover); }
        .music-ctrl:disabled { opacity: .35; cursor: not-allowed; }
        .music-ctrl.active { background: var(--primary-light); color: var(--primary); border-color: rgba(0,212,255,.4); }

        /* Player sits BELOW the song section — background-free */
        .music-player-slot {
            margin-top: 12px;
            min-height: 40px;
        }
        .music-player-slot audio-player { display: block; width: 100%; }
        .music-player-slot audio-player a { display: none !important; }

        #musicBtn.playing i { color: var(--primary); animation: musicPulse 1s ease-in-out infinite; }
        @keyframes musicPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }

        .app { flex: 1; display: flex; justify-content: center; padding: 24px 24px 32px; }
        .app.view-enter { animation: viewFadeIn .28s cubic-bezier(.16,1,.3,1) both; }
        @keyframes viewFadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .card { max-width: 720px; width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 26px 26px; box-shadow: var(--shadow); height: fit-content; opacity: 0; pointer-events: none; }
        .card.fonts-ready { opacity: 1; pointer-events: auto; animation: fadeUp .55s cubic-bezier(.16,1,.3,1) both; }
        .card.stats-card { opacity: 1; pointer-events: auto; }
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }

        .card.quiz-finished #progressDisplay, .card.quiz-finished #question-heading, .card.quiz-finished #spoilerContainer, .card.quiz-finished #answerBtnRow, .card.quiz-finished #feedbackArea { display: none !important; }

        .load-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--border); min-height: 0; }
        .load-bar.hidden-bar { display: none; }

        .quiz-picker { position: relative; display: inline-flex; align-items: center; flex-shrink: 0; }
        .quiz-picker-btn { width: 36px; height: 36px; padding: 0; border-radius: 50%; background: var(--bg-input); border: 1px solid var(--border); color: var(--primary); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: .95rem; line-height: 1; transition: background .2s ease, border-color .2s ease, color .2s ease, transform .15s ease, box-shadow .2s ease; }
        .quiz-picker-btn .fa-solid { transition: transform .25s ease; }
        .quiz-picker-btn:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--primary); color: var(--primary-hover); transform: scale(1.08); box-shadow: 0 4px 18px rgba(0,212,255,.35); }
        .quiz-picker-btn:hover:not(:disabled) .fa-solid { transform: rotate(-12deg); }
        .quiz-picker-btn:active:not(:disabled) { transform: scale(.97); }
        .quiz-picker-btn:disabled { opacity: .4; cursor: not-allowed; }
        .quiz-picker.open .quiz-picker-btn { background: var(--bg-hover); border-color: var(--primary); color: var(--primary-hover); box-shadow: 0 4px 18px rgba(0,212,255,.4); }

        .quiz-picker-menu { position: absolute; top: calc(100% + 10px); left: 0; display: block; padding: 6px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow); max-width: calc(100vw - 40px); opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.97); transform-origin: top left; transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s; z-index: 100; }
        .quiz-picker.open .quiz-picker-menu { opacity: 1; visibility: visible; transform: translateY(0) scale(1); transition: opacity .18s ease, transform .18s ease, visibility 0s linear 0s; }

        .quiz-picker-col { overflow-y: auto; max-height: 340px; min-width: 210px; }
        .quiz-picker-col::-webkit-scrollbar { width: 4px; }
        .quiz-picker-col::-webkit-scrollbar-track { background: transparent; }
        .quiz-picker-col::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 20px; }

        .quiz-picker-quizzes { position: absolute; left: calc(100% + 6px); top: 6px; min-width: 210px; max-width: 320px; max-height: 340px; overflow-y: auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px; box-shadow: var(--shadow); opacity: 0; visibility: hidden; transition: opacity .15s ease, visibility 0s linear .15s; z-index: 101; }
        .quiz-picker-quizzes.visible { opacity: 1; visibility: visible; transition: opacity .15s ease, visibility 0s linear 0s; }
        .quiz-picker-quizzes.direct-mode { position: static; left: auto; top: auto; min-width: 0; width: 100%; max-width: none; max-height: 340px; border: none; box-shadow: none; padding: 0; opacity: 1; visibility: visible; z-index: auto; transition: none; }

        .quiz-picker-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--text-secondary); background: transparent; border: none; border-radius: var(--radius-sm); cursor: pointer; text-align: left; transition: background var(--transition), color var(--transition); direction: ltr; overflow: hidden; }
        .quiz-picker-cat .quiz-cat { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); background: rgba(255,255,255,.05); padding: 4px 10px; border-radius: 5px; flex-shrink: 0; white-space: nowrap; }
        .quiz-picker-cat .quiz-cat-count { font-size: 10px; font-weight: 600; color: var(--text-muted); background: rgba(255,255,255,.04); padding: 2px 8px; border-radius: 10px; margin-left: auto; flex-shrink: 0; }
        .quiz-picker-cat .quiz-cat-arrow { font-size: 9px; color: var(--text-muted); transition: transform .2s ease, color .2s ease; width: auto; flex-shrink: 0; }
        .quiz-picker-cat:hover { background: var(--bg-hover); color: var(--text); }
        .quiz-picker-cat:hover .quiz-cat { background: rgba(255,255,255,.09); color: var(--text); }
        .quiz-picker-cat:hover .quiz-cat-arrow { color: var(--primary); transform: translateX(2px); }
        .quiz-picker-cat.active { background: var(--primary-light); }
        .quiz-picker-cat.active .quiz-cat { background: rgba(0,212,255,.16); color: var(--primary); }
        .quiz-picker-cat.active .quiz-cat-count { color: var(--primary); background: rgba(0,212,255,.1); }
        .quiz-picker-cat.active .quiz-cat-arrow { color: var(--primary); }
        .quiz-picker-quiz .quiz-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; direction: auto; text-align: left; }
        .quiz-picker-quiz:hover { background: var(--bg-hover); color: var(--text); }
        .quiz-picker-quiz.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .quiz-picker-quiz.active:hover { background: var(--primary-light); color: var(--primary-hover); }
        .quiz-picker-quiz.has-error .quiz-title { color: var(--danger); opacity: .8; }
        .quiz-picker-item.disabled { color: var(--text-muted); cursor: default; font-style: italic; justify-content: center; }
        .quiz-picker-item.disabled:hover { background: transparent; color: var(--text-muted); }

        .progress { color: var(--text-muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 20px; text-align: center; font-weight: 600; }
        .progress span { color: var(--primary); font-weight: 700; }

        .question { font-family: var(--font); font-size: 2rem; font-weight: 700; line-height: 1.55; letter-spacing: -.02em; margin-bottom: 30px; text-align: center; white-space: pre-wrap; min-height: 3.2rem; background: linear-gradient(135deg, #a78bfa, #34d399); background-size: 300% 300%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: gradShift 5s ease-in-out infinite alternate; dir: auto; }
        @keyframes gradShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .question::after { content: ''; display: block; width: 56px; height: 3px; margin: 14px auto 0; border-radius: 3px; background: linear-gradient(90deg, #a78bfa, #34d399); background-size: 200% 200%; animation: gradShift 5s ease-in-out infinite alternate; opacity: .4; }

        .spoiler-container { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; margin: 0 0 4px 0; padding: 0; }
        .spoiler-toggle { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; white-space: nowrap; transition: background .2s ease, border-color .2s ease, color .2s ease, transform .4s cubic-bezier(.34,1.56,.64,1); will-change: transform; }
        .spoiler-toggle:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .spoiler-toggle:disabled { opacity: .4; cursor: not-allowed; }
        .spoiler-container.revealed .spoiler-toggle { transform: translateY(var(--spoiler-lift, -6px)); }
        .spoiler-answer { font-family: var(--font); font-size: 14px; font-weight: 500; color: var(--primary); background: var(--primary-light); padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid rgba(0,212,255,.25); white-space: pre-wrap; line-height: 1.55; max-width: 100%; word-break: break-word; dir: auto; text-align: center; max-height: 0; opacity: 0; overflow: hidden; margin-top: 0; padding-top: 0; padding-bottom: 0; border-width: 0; transition: max-height .4s ease, opacity .35s ease, margin-top .35s ease, padding .35s ease, border-width .35s ease; }
        .spoiler-container.revealed .spoiler-answer { max-height: var(--answer-max-height, 800px); opacity: 1; margin-top: 6px; padding: 8px 16px; border-width: 1px; }

        .card.font-vazir .question, .card.font-vazir .failure-item .failure-q, .card.font-vazir .stats-item .stats-q { font-family: 'Vazir Bold', var(--font); }
        .card.font-vazir .spoiler-answer, .card.font-vazir .failure-item .failure-a, .card.font-vazir .stats-item .stats-a { font-family: 'Vazir', var(--font); }
        .card.font-jp .question, .card.font-jp .failure-item .failure-q, .card.font-jp .stats-item .stats-q { font-family: 'BIZ UDPMincho Bold', var(--font); }
        .card.font-jp .spoiler-answer, .card.font-jp .failure-item .failure-a, .card.font-jp .stats-item .stats-a { font-family: 'BIZ UDPMincho', var(--font); }

<body>

    <header class="header">
        <div class="header-left">
            <div class="header-logo">
                <i class="fas fa-graduation-cap"></i> Quiz<span>Master</span>
            </div>
        </div>
        <div class="header-actions">
            <div class="music-panel-wrap">

                <div class="music-panel" id="musicPanel">
                    <div class="music-panel-header">
                        <span class="music-panel-title">Music</span>
                        <button class="music-close" id="musicCloseBtn" type="button" title="Close">
                            <i class="fas fa-times"></i>

                    <!-- Playlist selector: button (name only) → dropdown menu (with covers) -->
                    <div class="music-playlist-selector" id="musicPlaylistSelector">
                        <button class="music-playlist-trigger" id="musicPlaylistTrigger" type="button" disabled>
                            <span class="music-playlist-trigger-name" id="musicPlaylistTriggerName">Loading playlists…</span>
                            <i class="fa-solid fa-chevron-down music-playlist-trigger-arrow"></i>

                        <div class="music-playlist-menu" id="musicPlaylistMenu"></div>

                    <!-- Song section: cover + name + controls -->
                    <div class="music-song">
                        <div class="music-now-playing">
                            <img class="music-cover" id="musicCover" src="" alt="" style="display:none;" />
                            <div class="music-info">
                                <div class="music-title" id="musicTitle">No track</div>
                                <div class="music-artist" id="musicArtist">—</div>
                            </div>
                        </div>
                        <div class="music-controls">
                            <button class="music-ctrl" id="musicShuffleBtn" type="button" title="Shuffle">

                            <button class="music-ctrl" id="musicPrevBtn" type="button" title="Previous">
                                <i class="fas fa-backward-step"></i>
                            </button>
                            <button class="music-ctrl" id="musicNextBtn" type="button" title="Next">
                                <i class="fas fa-forward-step"></i>
                            </button>
                        </div>

            <button class="btn-icon" id="statsBtn" type="button" title="View stats" disabled>

    <div class="app" id="quizApp">
        <main class="card" id="quizCard" role="main" aria-labelledby="question-heading">

            <div class="load-bar" id="quizLoadBar">
                <div class="quiz-picker" id="quizPicker">
                    <button class="quiz-picker-btn" id="quizPickerBtn" type="button" aria-label="Choose quiz file" aria-haspopup="true" aria-expanded="false" disabled>
                        <i class="fa-solid fa-book" aria-hidden="true"></i>
                    </button>
                    <div class="quiz-picker-menu" id="quizPickerMenu" role="menu" aria-label="Quizzes">
                        <div class="quiz-picker-col quiz-picker-categories" id="quizPickerCategories" role="group" aria-label="Categories"></div>
                        <div class="quiz-picker-col quiz-picker-quizzes" id="quizPickerQuizzes" role="group" aria-label="Quizzes"></div>
                    </div>
                </div>
            </div>

            <div class="progress" id="progressDisplay">
                Question <span id="currentNum">0</span> of <span id="totalNum">0</span>
            </div>

            <h1 id="question-heading" class="question" dir="auto">Loading…</h1>

            <div class="spoiler-container" id="spoilerContainer">
                <button class="spoiler-toggle" id="spoilerToggle" type="button">Show answer</button>
                <div class="spoiler-answer" id="spoilerAnswer"></div>

            <div class="btn-row" id="answerBtnRow">
                <button class="btn btn-know" id="knowBtn" type="button" disabled>
                    <span><i class="fa-solid fa-check" aria-hidden="true"></i> میدونم</span>
                </button>
                <button class="btn btn-dontknow" id="dontKnowBtn" type="button" disabled>
                    <span><i class="fa-solid fa-times" aria-hidden="true"></i> نمیدونم</span>
                </button>

            <div class="feedback" id="feedbackArea" role="status" aria-live="polite">
                <i class="icon fa-solid fa-folder-open" aria-hidden="true"></i>

            <section class="summary" id="summaryPanel" hidden aria-live="polite">

                <div id="summaryFailuresContainer"></div>

                    <button class="btn btn-know" id="summaryRestartBtn" type="button">

    <div class="app hidden" id="statsApp">
        <main class="card stats-card" role="main" aria-labelledby="stats-heading">
            <div class="stats-top-bar">
                <button class="btn-back" id="statsBackBtn" type="button">
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Quiz
                </button>
                <div id="statsPickerSlot"></div>
            </div>
            <h2 class="stats-title" id="stats-heading">
                <i class="fa-solid fa-dumbbell" aria-hidden="true"></i> Your Progress
            </h2>
            <div class="stats-overview" id="statsOverview"></div>
            <div class="stats-list" id="statsList"></div>
        </main>
    </div>

    <script>
        (function() {
            'use strict';

            const MANIFEST_URL = 'json/manifest.json';
            const JSON_DIR = 'json/';
            const VAZIR_LANGS = ['fa', 'ar', 'he', 'ur', 'ps'];
            const JP_LANGS = ['jp', 'ja'];
            const STATS_STORAGE_PREFIX = 'qstats_';
            const MUSIC_MANIFEST_URL = 'music/manifest.json';
            const MUSIC_DIR = 'music/';

            const card = document.getElementById('quizCard');
            const questionEl = document.getElementById('question-heading');
            const progressNum = document.getElementById('currentNum');
            const totalNum = document.getElementById('totalNum');
            const knowBtn = document.getElementById('knowBtn');
            const dontKnowBtn = document.getElementById('dontKnowBtn');
            const resetBtn = document.getElementById('resetBtn');
            const feedbackEl = document.getElementById('feedbackArea');
            const spoilerToggle = document.getElementById('spoilerToggle');
            const spoilerAnswer = document.getElementById('spoilerAnswer');
            const spoilerContainer = document.getElementById('spoilerContainer');
            const quizLoadBar = document.getElementById('quizLoadBar');
            const quizPicker = document.getElementById('quizPicker');
            const quizPickerBtn = document.getElementById('quizPickerBtn');
            const quizPickerMenu = document.getElementById('quizPickerMenu');
            const categoriesCol = document.getElementById('quizPickerCategories');
            const quizzesCol = document.getElementById('quizPickerQuizzes');
            const reloadBtn = document.getElementById('reloadBtn');
            const summaryPanel = document.getElementById('summaryPanel');
            const summaryStats = document.getElementById('summaryStats');
            const summaryFailuresContainer = document.getElementById('summaryFailuresContainer');
            const summaryRestartBtn = document.getElementById('summaryRestartBtn');
            const statsBtn = document.getElementById('statsBtn');
            const quizApp = document.getElementById('quizApp');
            const statsApp = document.getElementById('statsApp');
            const statsBackBtn = document.getElementById('statsBackBtn');
            const statsPickerSlot = document.getElementById('statsPickerSlot');
            const statsOverview = document.getElementById('statsOverview');
            const statsList = document.getElementById('statsList');

            const musicBtn = document.getElementById('musicBtn');
            const musicPanel = document.getElementById('musicPanel');
            const musicCloseBtn = document.getElementById('musicCloseBtn');
            const musicPlaylistSelector = document.getElementById('musicPlaylistSelector');
            const musicPlaylistTrigger = document.getElementById('musicPlaylistTrigger');
            const musicPlaylistTriggerName = document.getElementById('musicPlaylistTriggerName');
            const musicPlaylistMenu = document.getElementById('musicPlaylistMenu');
            const musicCover = document.getElementById('musicCover');
            const musicTitle = document.getElementById('musicTitle');
            const musicArtist = document.getElementById('musicArtist');
            const musicShuffleBtn = document.getElementById('musicShuffleBtn');
            const musicPrevBtn = document.getElementById('musicPrevBtn');
            const musicNextBtn = document.getElementById('musicNextBtn');
            const musicPlayerSlot = document.getElementById('musicPlayerSlot');

            // Quiz state
            let ALL_QUESTIONS = [];
            let shuffledQuestions = [];
            let currentIndex = 0;
            let isComplete = false;
            let autoAdvanceTimer = null;
            let spoilerVisible = false;
            let currentFile = '';
            let currentCategory = '';
            let currentLanguage = '';
            let currentQuizTitle = '';
            let failures = [];
            let currentStats = {};
            let QUIZ_CACHE = {};
            let QUIZ_TREE = {};
            let HAS_CATEGORIES = false;
            let hoverCloseTimer = null;
            let activeCategoryPreview = '';

            // Music state
            let MUSIC_PLAYLISTS = [];
            let currentPlaylistIndex = 0;
            let currentPlaylist = null;
            let currentTrackIndex = 0;
            let musicShuffle = false;
            let musicAudioEl = null;
            const musicMetaCache = new Map();
            const musicMetaPending = new Map();

            // ─── HELPERS ───
            function normalizeAnswer(answer) {
                if (Array.isArray(answer)) return answer.map(String).join('\n');
                if (answer == null) return '';
                return String(answer).replace(/<br\s*\/?>/gi, '\n');
            }
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }
            function escapeHtml(str) {
                return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }
            function setFeedback(iconClass, message, type) {
                feedbackEl.classList.remove('correct', 'wrong', 'done');
                const iconSpan = feedbackEl.querySelector('.icon');
                if (iconSpan) iconSpan.className = 'icon fa-solid ' + iconClass;
                const msgSpan = feedbackEl.querySelector('.msg');
                if (msgSpan) msgSpan.innerHTML = message;
                if (type) feedbackEl.classList.add(type);
            }
            function resetFeedback() { setFeedback('fa-hourglass-half', 'Choose میدونم or نمیدونم.', null); }
            function updateProgress() {
                progressNum.textContent = Math.min(currentIndex + 1, shuffledQuestions.length);
                totalNum.textContent = shuffledQuestions.length;
            }

            function hashString(str) {
                let hash = 5381;
                const s = String(str || '');
                for (let i = 0; i < s.length; i++) {
                    hash = ((hash << 5) + hash) + s.charCodeAt(i);
                    hash = hash & hash;
                }
                return (hash >>> 0).toString(36);
            }
            function statsStorageKey(filename) { return STATS_STORAGE_PREFIX + hashString(filename); }
            function loadStats(filename) {
                const key = statsStorageKey(filename);
                try {
                    const raw = localStorage.getItem(key);
                    if (!raw) return {};
                    const parsed = JSON.parse(raw);
                    return (parsed && typeof parsed === 'object') ? parsed : {};
                } catch (e) { return {}; }
            }
            function saveStats(filename, stats) {
                try { localStorage.setItem(statsStorageKey(filename), JSON.stringify(stats)); }
                catch (e) { console.warn('localStorage save failed:', e); }
            }
            function recordStat(questionText, status) {
                if (!currentFile) return;
                currentStats[hashString(questionText)] = status;
                saveStats(currentFile, currentStats);
            }
            function getQuestionStatus(questionText) {
                if (!currentStats || typeof currentStats !== 'object') return 'unanswered';
                const s = currentStats[hashString(questionText)];
                if (s === 'c') return 'correct';
                if (s === 'w') return 'wrong';
                return 'unanswered';
            }

            function getFontSpecs(language) {
                const lang = (language || '').toLowerCase().trim();
                const specs = ['400 16px Inter', '700 16px Inter', '900 16px "Font Awesome 6 Free"'];
                if (VAZIR_LANGS.indexOf(lang) !== -1) { specs.push('400 16px Vazir'); specs.push('700 16px "Vazir Bold"'); }
                if (JP_LANGS.indexOf(lang) !== -1) { specs.push('400 16px "BIZ UDPMincho"'); specs.push('700 16px "BIZ UDPMincho Bold"'); }
                return specs;
            }
            function fontsAlreadyLoaded(language) {
                return getFontSpecs(language).every(function(spec) { return document.fonts.check(spec); });
            }
            async function waitForFonts(language) {
                const specs = getFontSpecs(language);
                const timeout = new Promise(function(resolve) { setTimeout(resolve, 3000); });
                try {
                    await Promise.race([
                        Promise.all(specs.map(function(spec) { return document.fonts.load(spec).catch(function() {}); })),
                        timeout
                    ]);
                } catch (err) {}
            }
            function ensureFontsAndReveal(language) {
                if (fontsAlreadyLoaded(language)) { card.classList.add('fonts-ready'); return; }
                card.classList.remove('fonts-ready');
                waitForFonts(language).then(function() { card.classList.add('fonts-ready'); });
            }

            function normalizeManifest(manifest) {
                const out = [];
                if (manifest && manifest.categories && typeof manifest.categories === 'object') {
                    Object.keys(manifest.categories).forEach(function(cat) {
                        const list = manifest.categories[cat];
                        if (!Array.isArray(list)) return;
                        list.forEach(function(fname) {
                            if (typeof fname === 'string' && fname.trim()) out.push({ file: fname.trim(), category: cat });
                        });
                    });
                    return out;
                }
                if (manifest && Array.isArray(manifest.files)) {
                    manifest.files.forEach(function(entry) {
                        if (typeof entry === 'string') {
                            if (entry.trim()) out.push({ file: entry.trim(), category: '' });
                        } else if (entry && typeof entry.file === 'string' && entry.file.trim()) {
                            out.push({ file: entry.file.trim(), category: (typeof entry.category === 'string') ? entry.category.trim() : '' });
                        }
                    });
                }
                return out;
            }

            async function preloadAllQuizzes(entries) {
                await Promise.all(entries.map(async function(entry) {
                    const filename = entry.file;
                    try {
                        const res = await fetch(JSON_DIR + filename, { cache: 'no-store' });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        const title = (data && typeof data.title === 'string' && data.title.trim()) ? data.title.trim() : filename.replace(/\.json$/i, '');
                        QUIZ_CACHE[filename] = { data: data, title: title, error: null };
                    } catch (err) {
                        QUIZ_CACHE[filename] = { data: null, title: filename.replace(/\.json$/i, ''), error: err.message || 'Failed to load' };
                    }
                }));
            }
            function buildQuizTree(entries) {
                QUIZ_TREE = {};
                HAS_CATEGORIES = false;
                entries.forEach(function(entry) {
                    const info = QUIZ_CACHE[entry.file] || {};
                    const title = info.title || entry.file.replace(/\.json$/i, '');
                    const cat = (entry.category || '').trim() || 'Uncategorized';
                    if (entry.category && entry.category.trim()) HAS_CATEGORIES = true;
                    if (!QUIZ_TREE[cat]) QUIZ_TREE[cat] = [];
                    QUIZ_TREE[cat].push({ file: entry.file, title: title, error: info.error || null });
                });
            }

                currentFile = filename;

                    .then(function(data) {
                        const title = (data && typeof data.title === 'string' && data.title.trim()) ? data.title.trim() : filename.replace(/\.json$/i, '');
                        currentQuizTitle = title;
                        QUIZ_CACHE[filename] = { data: data, title: title, error: null };
                        for (const cat in QUIZ_TREE) {

                        setFeedback('fa-exclamation-circle', 'Could not load ' + filename + ': ' + err.message, 'wrong');

            function waitForAudioPlayer(timeout) {
                timeout = timeout || 5000;
                if (customElements.get('audio-player')) return Promise.resolve();
                return new Promise(function(resolve, reject) {
                    const start = Date.now();
                    (function check() {
                        if (customElements.get('audio-player')) return resolve();
                        if (Date.now() - start > timeout) return reject(new Error('Audio player failed to load'));
                        setTimeout(check, 100);
                    })();
                });
            }

            function deriveFromUrl(url) {
                try {
                    let name = url.split('?')[0].split('#')[0].split('/').pop();
                    name = decodeURIComponent(name);
                    name = name.replace(/\.(mp3|ogg|m4a|wav|flac|aac|opus|webm|mp4)$/i, '');
                    name = name.replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ').trim();
                    name = name.replace(/^\d+\s*[-.]?\s*/, '');
                    const dashMatch = name.match(/^(.+?)\s*[-–—]\s*(.+)$/);
                    if (dashMatch) {
                        return {
                            title: dashMatch[2].trim() || dashMatch[1].trim(),
                            artist: dashMatch[1].trim() || 'Unknown Artist',
                            cover: ''
                        };
                    }
                    return { title: name || 'Untitled', artist: 'Unknown Artist', cover: '' };
                } catch (e) {
                    return { title: 'Untitled', artist: 'Unknown Artist', cover: '' };
                }
            }

            function pictureToDataUrl(picture) {
                if (!picture || !picture.data) return '';
                try {
                    const data = picture.data;
                    const len = data.length;
                    let binary = '';
                    const chunkSize = 0x8000;
                    for (let i = 0; i < len; i += chunkSize) {
                        const chunk = (typeof data.subarray === 'function')
                            ? data.subarray(i, i + chunkSize)
                            : data.slice(i, i + chunkSize);
                        binary += String.fromCharCode.apply(null, chunk);
                    }
                    const base64 = btoa(binary);
                    const format = ((picture.format || 'image/jpeg').split(' ')[0] || 'image/jpeg').toLowerCase();
                    return 'data:' + format + ';base64,' + base64;
                } catch (e) {
                    console.warn('pictureToDataUrl failed:', e);
                    return '';
                }
            }

            function fetchTrackMeta(url) {
                if (musicMetaCache.has(url)) return Promise.resolve(musicMetaCache.get(url));
                if (musicMetaPending.has(url)) return musicMetaPending.get(url);

                const p = (async function() {
                    const fallback = deriveFromUrl(url);
                    if (typeof jsmediatags === 'undefined') {
                        musicMetaCache.set(url, fallback);
                        return fallback;
                    }
                    try {
                        const absoluteUrl = new URL(url, window.location.href).href;
                        const controller = new AbortController();
                        const timeoutId = setTimeout(function() { controller.abort(); }, 20000);
                        let blob;
                        try {
                            const response = await fetch(absoluteUrl, {
                                headers: { 'Range': 'bytes=0-1048575' },
                                signal: controller.signal
                            });
                            clearTimeout(timeoutId);
                            if (!response.ok && response.status !== 206) throw new Error('HTTP ' + response.status);
                            blob = await response.blob();
                        } catch (e) {
                            clearTimeout(timeoutId);
                            throw e;
                        }
                        const tags = await new Promise(function(resolve, reject) {
                            try {
                                jsmediatags.read(blob, {
                                    onSuccess: function(tag) { resolve(tag.tags || {}); },
                                    onError: function(error) { reject(new Error((error && error.type) || 'read error')); }
                                });
                            } catch (e) { reject(e); }
                        });
                        const meta = {
                            title:  (tags.title  && String(tags.title).trim())  || fallback.title,
                            artist: (tags.artist && String(tags.artist).trim()) || fallback.artist,
                            cover:  pictureToDataUrl(tags.picture)
                        };
                        musicMetaCache.set(url, meta);
                        return meta;
                    } catch (err) {
                        console.warn('Metadata read failed for', url, '-', err.message);
                        musicMetaCache.set(url, fallback);
                        return fallback;
                    }
                })();

                musicMetaPending.set(url, p);
                p.finally(function() { musicMetaPending.delete(url); });
                return p;
            }

            function normalizeSong(s) {
                if (typeof s === 'string') return { url: s };
                if (s && typeof s.url === 'string') {
                    return {
                        url: s.url,
                        title: typeof s.title === 'string' ? s.title : '',
                        artist: typeof s.artist === 'string' ? s.artist : '',
                        cover: typeof s.cover === 'string' ? s.cover : ''
                    };
                }
                return null;
            }

            async function getSongMeta(song) {
                if (song.title && song.artist) {
                    return { title: song.title, artist: song.artist, cover: song.cover || '' };
                }
                const fetched = await fetchTrackMeta(song.url);
                return {
                    title: song.title || fetched.title,
                    artist: song.artist || fetched.artist,
                    cover: song.cover || fetched.cover
                };
            }

            function applyTrackDisplay(meta) {
                musicTitle.textContent = meta.title || 'Untitled';
                musicArtist.textContent = meta.artist || 'Unknown Artist';
                if (meta.cover) {
                    musicCover.src = meta.cover;
                    musicCover.style.display = '';
                } else {
                    musicCover.removeAttribute('src');
                    musicCover.style.display = 'none';
                }
            }

            // ─── PLAYLIST DROPDOWN ───
            function updatePlaylistTriggerLabel() {
                const p = MUSIC_PLAYLISTS[currentPlaylistIndex];
                if (!p) {
                    musicPlaylistTriggerName.textContent = 'No playlists';
                    return;
                }
                musicPlaylistTriggerName.textContent = p.name || p.file.replace(/\.json$/i, '');
            }

            function renderPlaylistMenu() {
                if (MUSIC_PLAYLISTS.length === 0) {
                    musicPlaylistMenu.innerHTML = '<div class="music-playlist-empty">No playlists available</div>';
                    musicPlaylistTriggerName.textContent = 'No playlists';
                    musicPlaylistTrigger.disabled = true;
                    return;
                }

                let html = '';
                MUSIC_PLAYLISTS.forEach(function(p, i) {
                    const isActive = i === currentPlaylistIndex;
                    const name = p.name || p.file.replace(/\.json$/i, '');
                    html +=
                        '<button type="button" class="music-playlist-item' + (isActive ? ' active' : '') + '" data-index="' + i + '">' +
                            '<div class="music-playlist-cover" id="playlistCover_' + i + '"><i class="fas fa-music"></i></div>' +
                            '<span class="music-playlist-name">' + escapeHtml(name) + '</span>' +
                        '</button>';
                });
                musicPlaylistMenu.innerHTML = html;

                musicPlaylistMenu.querySelectorAll('.music-playlist-item').forEach(function(el) {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(el.dataset.index, 10);
                        if (!isNaN(idx) && idx !== currentPlaylistIndex) {
                            selectPlaylist(idx);
                        }
                        closePlaylistMenu();
                    });
                });

                updatePlaylistTriggerLabel();
                musicPlaylistTrigger.disabled = false;

                // Load covers in the background (parallel)
                MUSIC_PLAYLISTS.forEach(function(p, i) {
                    fetchPlaylistCover(i).then(function(cover) {
                        if (!cover) return;
                        const coverEl = document.getElementById('playlistCover_' + i);
                        if (!coverEl || coverEl.querySelector('img')) return;
                        coverEl.innerHTML = '<img src="' + cover.replace(/"/g, '&quot;') + '" alt="" />';
                    });
                });
            }

            // Fetch the first song's cover art for a playlist
            async function fetchPlaylistCover(index) {
                const p = MUSIC_PLAYLISTS[index];
                if (!p) return null;
                if (p._cover !== undefined) return p._cover;

                try {
                    const res = await fetch(MUSIC_DIR + p.file, { cache: 'no-store' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    const raw = Array.isArray(data) ? data : (data.songs || []);
                    const songs = raw.map(normalizeSong).filter(Boolean);
                    if (songs.length === 0) { p._cover = null; return null; }
                    const meta = await fetchTrackMeta(songs[0].url);
                    p._cover = meta.cover || null;
                    return p._cover;
                } catch (e) {
                    p._cover = null;
                    return null;
                }
            }

            async function buildPlayerAudio(url) {
                try {
                    await waitForAudioPlayer(5000);
                } catch (e) {
                    musicTitle.textContent = 'Player unavailable';
                    musicArtist.textContent = 'Video.js failed to load';
                    musicPlayerSlot.innerHTML = '';
                    musicAudioEl = null;
                    return null;
                }
                musicPlayerSlot.innerHTML =
                    '<audio-player><audio-skin><audio src="' + url.replace(/"/g, '&quot;') + '" preload="metadata"></audio></audio-skin></audio-player>';
                musicAudioEl = musicPlayerSlot.querySelector('audio');
                if (!musicAudioEl) return null;

                musicAudioEl.addEventListener('play', function() { musicBtn.classList.add('playing'); });
                musicAudioEl.addEventListener('pause', function() { if (!musicAudioEl.ended) musicBtn.classList.remove('playing'); });
                musicAudioEl.addEventListener('ended', function() {
                    musicBtn.classList.remove('playing');
                    nextTrack(true);
                });
                musicAudioEl.addEventListener('error', function() {
                    musicTitle.textContent = 'Failed to load audio';
                    musicArtist.textContent = 'Check the URL';
                    musicBtn.classList.remove('playing');
                });
                return musicAudioEl;
            }

            async function loadMusicManifest() {
                try {
                    const res = await fetch(MUSIC_MANIFEST_URL, { cache: 'no-store' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    const playlists = Array.isArray(data) ? data : (data.playlists || []);
                    MUSIC_PLAYLISTS = playlists.filter(function(p) { return p && typeof p.file === 'string' && p.file.trim(); });
                    if (MUSIC_PLAYLISTS.length === 0) throw new Error('No playlists in manifest');

                    renderPlaylistMenu();
                    await selectPlaylist(0);
                } catch (err) {
                    console.warn('Music manifest failed:', err);
                    musicTitle.textContent = 'No music available';
                    musicArtist.textContent = 'Add music/manifest.json';
                    musicPlaylistMenu.innerHTML = '<div class="music-playlist-empty">No playlists available</div>';
                    musicPlaylistTriggerName.textContent = 'No playlists';
                    musicPlaylistTrigger.disabled = true;
                }
            }

            async function selectPlaylist(index) {
                if (index < 0 || index >= MUSIC_PLAYLISTS.length) return;
                currentPlaylistIndex = index;
                updatePlaylistTriggerLabel();

                musicPlaylistMenu.querySelectorAll('.music-playlist-item').forEach(function(el, i) {
                    el.classList.toggle('active', i === index);
                });

                try {
                    const res = await fetch(MUSIC_DIR + MUSIC_PLAYLISTS[index].file, { cache: 'no-store' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    const raw = Array.isArray(data) ? data : (data.songs || []);
                    const songs = raw.map(normalizeSong).filter(Boolean);
                    if (songs.length === 0) throw new Error('No valid songs');
                    currentPlaylist = {
                        title: data.title || MUSIC_PLAYLISTS[index].name || 'Playlist',
                        songs: songs
                    };
                    currentTrackIndex = 0;
                    await loadTrack(0, false);
                } catch (err) {
                    console.warn('Playlist load failed:', err);
                    musicTitle.textContent = 'Failed to load';
                    musicArtist.textContent = err.message;
                }
            }

            async function loadTrack(index, autoplay) {
                if (!currentPlaylist || currentPlaylist.songs.length === 0) return;
                const total = currentPlaylist.songs.length;
                currentTrackIndex = ((index % total) + total) % total;
                const song = currentPlaylist.songs[currentTrackIndex];

                applyTrackDisplay(deriveFromUrl(song.url));
                await buildPlayerAudio(song.url);

                if (autoplay && musicAudioEl) {
                    try { await musicAudioEl.play(); } catch (e) {}
                }

                const urlAtStart = song.url;
                getSongMeta(song).then(function(meta) {
                    if (!currentPlaylist || !currentPlaylist.songs[currentTrackIndex]) return;
                    if (currentPlaylist.songs[currentTrackIndex].url !== urlAtStart) return;
                    applyTrackDisplay(meta);
                });
            }

            function nextTrack(autoplay) {
                if (!currentPlaylist || currentPlaylist.songs.length === 0) return;
                const total = currentPlaylist.songs.length;
                let next;
                if (musicShuffle && total > 1) {
                    do { next = Math.floor(Math.random() * total); } while (next === currentTrackIndex);
                } else {
                    next = currentTrackIndex + 1;
                }
                loadTrack(next, autoplay !== false);
            }

            function prevTrack() {
                if (!currentPlaylist || currentPlaylist.songs.length === 0) return;
                const total = currentPlaylist.songs.length;
                let prev;
                if (musicShuffle && total > 1) {
                    do { prev = Math.floor(Math.random() * total); } while (prev === currentTrackIndex);
                } else {
                    prev = currentTrackIndex - 1;
                }
                loadTrack(prev, true);
            }

            musicBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                musicPanel.classList.toggle('open');
                if (!musicPanel.classList.contains('open')) closePlaylistMenu();
            });
            musicCloseBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                musicPanel.classList.remove('open');
                closePlaylistMenu();
            });
            musicShuffleBtn.addEventListener('click', function() {
                musicShuffle = !musicShuffle;
                musicShuffleBtn.classList.toggle('active', musicShuffle);
            });
            musicPrevBtn.addEventListener('click', function() { prevTrack(); });
            musicNextBtn.addEventListener('click', function() { nextTrack(true); });

            // ─── QUIZ EVENTS ───
            knowBtn.addEventListener('click', markKnown);
            dontKnowBtn.addEventListener('click', markUnknown);
            resetBtn.addEventListener('click', restartQuiz);
            summaryRestartBtn.addEventListener('click', restartQuiz);
            spoilerToggle.addEventListener('click', toggleSpoiler);
            statsBtn.addEventListener('click', function() {
                if (statsApp.classList.contains('hidden')) openStatsView();
                else closeStatsView();
            });
            statsBackBtn.addEventListener('click', closeStatsView);
            reloadBtn.addEventListener('click', function() {
                cancelClose();
                closePicker();
                if (currentFile) fetchJsonFile(currentFile);
                else loadManifestAndFirstQuiz();
            });

            card.classList.remove('font-vazir', 'font-jp', 'quiz-finished', 'fonts-ready');
            statsBtn.disabled = true;
            showEmptyState('Loading quiz…');
            loadManifestAndFirstQuiz();
            loadMusicManifest();

        })();
    </script>
