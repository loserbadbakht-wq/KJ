name: Download and Push Zip

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Direct ZIP URL'
        required: true
        type: string

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ZIP
        id: dl
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail

          echo "=== URL ==="
          echo "$ZIP_URL"

          # Extract filename from the URL path, ignoring query string
          ZIP_NAME=$(echo "$ZIP_URL" | sed 's/[?#].*$//' | awk -F'/' '{print $NF}')
          if [ -z "$ZIP_NAME" ]; then
            echo "::error::Could not determine filename from URL."
            exit 1
          fi
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "Zip file will be: $ZIP_NAME"

          curl -L --fail --retry 3 --retry-delay 5 \
            -A 'Mozilla/5.0' \
            -o "$ZIP_NAME" \
            "$ZIP_URL"

          ls -lh "$ZIP_NAME"
          file "$ZIP_NAME"

      - name: Unzip (flattened into fonts/)
        run: |
          set -euo pipefail
          ZIP_NAME="${{ steps.dl.outputs.zip_name }}"
          TMP_DIR=".tmp_extract"

          mkdir -p "$TMP_DIR" fonts

          # Extract as-is; if the archive has non-UTF8 filenames, -O UTF-8 helps on some systems.
          # Fall back to plain unzip if -O isn't supported (older unzip builds).
          unzip -o -O UTF-8 "$ZIP_NAME" -d "$TMP_DIR" 2>/dev/null \
            || unzip -o "$ZIP_NAME" -d "$TMP_DIR"

          rm -f "$ZIP_NAME"

          # Grab only font files, excluding anything under an out/ build tree.
          found=0
          while IFS= read -r -d '' f; do
            mv -f "$f" fonts/
            found=1
          done < <(find "$TMP_DIR" -type f \
                     -not -path '*/out/*' \
                     \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' \) \
                     -print0)

          rm -rf "$TMP_DIR"

          if [ "$found" -eq 0 ]; then
            echo "::error::No font files (.ttf/.otf/.woff/.woff2) found in the zip."
            exit 1
          fi

          echo "=== fonts/ contents ==="
          ls -la fonts

      - name: Commit and push
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f fonts

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Add fonts"
          git push
