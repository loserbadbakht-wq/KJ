name: Download and Push Zip

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Direct ZIP URL'
        required: true
        type: string

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ZIP
        id: dl
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail

          echo "=== URL ==="
          echo "$ZIP_URL"

          # Extract filename from the URL path, ignoring query string
          ZIP_NAME=$(echo "$ZIP_URL" | sed 's/[?#].*$//' | awk -F'/' '{print $NF}')
          if [ -z "$ZIP_NAME" ]; then
            echo "::error::Could not determine filename from URL."
            exit 1
          fi
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "Zip file will be: $ZIP_NAME"

          curl -L --fail --retry 3 --retry-delay 5 \
            -A 'Mozilla/5.0' \
            -o "$ZIP_NAME" \
            "$ZIP_URL"

          ls -lh "$ZIP_NAME"
          file "$ZIP_NAME"

      - name: Unzip (flattened into fonts/)
        run: |
          set -euo pipefail
          ZIP_NAME="${{ steps.dl.outputs.zip_name }}"
          TMP_DIR=".tmp_extract"

          mkdir -p "$TMP_DIR" fonts
          unzip -o "$ZIP_NAME" -d "$TMP_DIR"
          rm -f "$ZIP_NAME"

          # Move every file (any depth) into fonts/ flat, dropping the folder structure
          find "$TMP_DIR" -type f -exec mv -t fonts {} +

          rm -rf "$TMP_DIR"

          echo "=== fonts/ contents ==="
          ls -la fonts

      - name: Commit and push
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f fonts

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Add fonts"
          git push
